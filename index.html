<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sully Bec Instituto - Gestión Integral</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { --primary-color: #6366f1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { color: var(--primary-color); font-weight: 800; border-bottom: 3px solid var(--primary-color); }
        .balance-card { background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%); }
        .sticky-header { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        
        .logo-box { background: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1); overflow: hidden; }

        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #f43f5e; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        input, select { outline: none !important; }
        .card-alumno { transition: transform 0.2s; }
        .card-alumno:active { transform: scale(0.98); }
        
        /* Custom scrollbar for mobile nav */
        nav::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <div class="sticky-header px-4 py-3">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="logo-box w-11 h-11 rounded-xl flex items-center justify-center border border-slate-200">
                    <img src="https://lh3.googleusercontent.com/d/1gjM8QJhfynpT0il86P3IRWwD_wMQWcCC" 
                         alt="Sully Bec Instituto Logo" 
                         class="w-full h-full object-cover"
                         onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'text-indigo-600 font-black text-xl\'>SB</span>';">
                </div>
                <div>
                    <h1 class="text-lg font-extrabold text-indigo-950 tracking-tight leading-none">Sully Bec</h1>
                    <p class="text-[8px] font-bold text-rose-400 uppercase tracking-widest mt-0.5">Instituto</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-100 px-3 py-1 rounded-full">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <p class="text-[9px] font-black text-slate-500 uppercase">Sistema Activo</p>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 pt-4 pb-24">
        <div class="balance-card p-6 rounded-[2rem] text-white mb-6 shadow-xl text-center">
            <p class="text-[10px] font-bold opacity-70 uppercase tracking-widest">Saldo en Caja (Real)</p>
            <h2 id="total-balance" class="text-5xl font-black mt-1">$0</h2>
            <div class="flex justify-center gap-8 mt-6">
                <div><p class="text-[9px] font-bold uppercase opacity-60">Ingresos</p><p id="total-ingresos" class="text-sm font-black text-emerald-300">$0</p></div>
                <div><p class="text-[9px] font-bold uppercase opacity-60">Egresos</p><p id="total-egresos" class="text-sm font-black text-rose-300">$0</p></div>
            </div>
        </div>

        <nav class="flex mb-6 bg-white p-1 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
            <button onclick="switchTab('finanzas')" id="btn-finanzas" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase tab-active whitespace-nowrap">Cobros Rápidos</button>
            <button onclick="switchTab('gestion')" id="btn-gestion" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase text-slate-400 whitespace-nowrap">Alumnos</button>
            <button onclick="switchTab('cursos')" id="btn-cursos" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase text-slate-400 whitespace-nowrap">Cursos</button>
        </nav>

        <section id="sec-finanzas" class="space-y-6">
            <div class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nuevo Movimiento</h3>
                    <div class="flex items-center gap-2 bg-rose-50 px-3 py-1.5 rounded-xl border border-rose-100">
                        <span class="text-[8px] font-black text-rose-600 uppercase">Carga de Historial</span>
                        <label class="switch"><input type="checkbox" id="solo-historial"><span class="slider"></span></label>
                    </div>
                </div>

                <form id="finance-form" class="space-y-4">
                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Concepto</label>
                        <select id="categoria" onchange="toggleFields()" class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm text-indigo-950">
    <optgroup label="Cobros">
        <option value="ingreso-clase">Pago de Clase (Diplomado)</option>
        <option value="ingreso-taller">Pago Único por Taller</option>
        <option value="ingreso-consulta">Consulta</option>
        <option value="ingreso-renta">Renta de Consultorio</option>
        <option value="ingreso-otro">Otro Ingreso</option>
    </optgroup>
    <optgroup label="Gastos">
        <option value="egreso-renta">Renta</option>
        <option value="egreso-luz">Luz</option>
        <option value="egreso-internet">Internet</option>
        <option value="egreso-profesores">Pago a Profesores</option>
        <option value="egreso-otros">Otros Egresos</option>
    </optgroup>
</select>
                    </div>

                    <div id="fields-alumno" class="bg-indigo-50/50 p-4 rounded-2xl space-y-3 border border-indigo-100">
                        <select id="select-alumno" onchange="autoSugerirSesionYFecha()" class="w-full bg-white border-none rounded-lg p-3 text-sm font-bold shadow-sm text-indigo-900">
                            <option value="">Selecciona Alumno...</option>
                        </select>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="block text-[9px] font-bold text-indigo-400 mb-1 uppercase">Sesión N°</label><input type="number" id="num-sesion" class="w-full bg-white border-none rounded-lg p-3 text-xs font-bold shadow-sm"></div>
                            <div><label class="block text-[9px] font-bold text-indigo-400 mb-1 uppercase">Fecha que se paga</label><input type="date" id="fecha-clase-corresponde" class="w-full bg-white border-none rounded-lg p-3 text-xs font-bold shadow-sm"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Fecha del Recibo</label>
                            <input type="date" id="fecha-pago-real" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Monto $</label>
                            <input type="number" id="monto" placeholder="0.00" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        </div>
                    </div>

                    <input type="text" id="descripcion" placeholder="Notas adicionales..." class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">
                    <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase text-xs">Registrar Movimiento</button>
                </form>
            </div>
            
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-2">Movimientos Recientes</h3>
            <div id="lista-transacciones" class="space-y-2"></div>
        </section>

        <section id="sec-gestion" class="hidden space-y-6">
            <div id="form-alumno-container" class="bg-white border-2 border-indigo-100 rounded-[2rem] p-6 shadow-sm">
                <h3 id="form-alumno-title" class="text-[11px] font-black text-indigo-600 uppercase mb-4">Registro / Edición de Alumno</h3>
                <form id="alumno-form" class="space-y-3">
                    <input type="hidden" id="edit-id-alumno">
                    <input type="text" id="nombre-alumno" placeholder="Nombre Completo" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                    <select id="select-curso-alumno" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                        <option value="">Selecciona Curso...</option>
                    </select>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="curp-alumno" placeholder="CURP" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                        <input type="tel" id="tel-alumno" placeholder="Teléfono" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                    </div>
                    <input type="date" id="fecha-inicio-alumno" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-alumno" class="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase">Guardar Alumno</button>
                        <button type="button" id="btn-cancelar-edit" onclick="cancelarEdicionAlum()" class="hidden bg-slate-200 text-slate-500 py-4 px-6 rounded-xl font-black text-xs uppercase">Cancelar</button>
                    </div>
                </form>
            </div>
            <div id="ui-alumnos" class="grid grid-cols-1 gap-3"></div>
        </section>

        <section id="sec-cursos" class="hidden space-y-6">
            <div id="form-curso-container" class="bg-white border-2 border-slate-900 rounded-[2rem] p-6 shadow-sm">
                <h3 id="form-curso-title" class="text-[10px] font-black text-slate-400 uppercase mb-4">Nuevo Diplomado</h3>
                <form id="curso-form" class="space-y-3">
                    <input type="hidden" id="edit-id-curso">
                    <input type="text" id="nombre-curso" placeholder="Nombre del Diplomado" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Inicio del Curso</label>
                            <input type="date" id="fecha-inicio-curso" required onchange="window.calcularFechaTermino()" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold text-indigo-600">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Término (Auto)</label>
                            <input type="date" id="fecha-termino-curso" readonly class="w-full bg-slate-200 border-none rounded-xl p-3 text-sm font-bold text-slate-500 cursor-not-allowed">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="duracion-curso" placeholder="Sesiones" required onchange="window.calcularFechaTermino()" onkeyup="window.calcularFechaTermino()" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                        <input type="number" id="costo-clase" placeholder="Costo Sesión $" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                    </div>

                    <div class="bg-slate-50 p-3 rounded-xl">
                        <label class="block text-[9px] font-black text-slate-400 uppercase mb-2">Fechas sin clase (Vacaciones/Feriados)</label>
                        <div class="flex gap-2 mb-2">
                            <input type="date" id="fecha-sin-clase" class="flex-1 bg-white border-none rounded-lg p-2 text-xs font-bold">
                            <button type="button" onclick="agregarFechaSinClase()" class="bg-rose-500 text-white px-4 rounded-lg text-[9px] font-black uppercase">Añadir</button>
                        </div>
                        <div id="lista-fechas-inactivas" class="flex flex-wrap gap-1"></div>
                        <input type="hidden" id="fechas-inactivas-json" value="[]">
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="btn-submit-curso" class="flex-1 bg-slate-900 text-white py-4 rounded-xl font-black text-xs uppercase">Guardar Curso</button>
                        <button type="button" id="btn-cancelar-curso" onclick="cancelarEdicionCurso()" class="hidden bg-slate-200 text-slate-500 py-4 px-6 rounded-xl font-black text-xs uppercase">Cancelar</button>
                    </div>
                </form>
            </div>
            <div id="ui-cursos" class="space-y-3"></div>
        </section>
    </div>

    <div id="modal-historial" class="fixed inset-0 bg-white z-[100] hidden flex flex-col">
        <div class="p-6 bg-indigo-900 text-white flex justify-between items-center">
            <h2 id="modal-nombre" class="text-xl font-black uppercase tracking-tight">Historial</h2>
            <button onclick="cerrarModal()" class="bg-white/20 px-4 py-2 rounded-xl text-xs font-bold uppercase">Cerrar</button>
        </div>
        <div id="modal-content" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcAda5-ewiR78bfLyYrjEMhfdc0RFxd7s",
            authDomain: "finanzas-escuela.firebaseapp.com",
            projectId: "finanzas-escuela",
            storageBucket: "finanzas-escuela.firebasestorage.app",
            messagingSenderId: "106864276061",
            appId: "1:106864276061:web:cc8b26cca0ef07088f13b4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let transacciones = [], alumnos = [], cursos = [];

        // --- LISTENERS ---
        onSnapshot(query(collection(db, "transacciones"), orderBy("timestamp", "desc")), (snap) => {
            transacciones = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderFinanzas();
            renderAlumnos(); 
        });

        onSnapshot(query(collection(db, "alumnos"), orderBy("nombre", "asc")), (snap) => {
            alumnos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderAlumnos();
            populateSelects();
        });

        onSnapshot(query(collection(db, "cursos"), orderBy("nombre", "asc")), (snap) => {
            cursos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderCursos();
            populateSelects();
            renderAlumnos();
        });

        // --- RENDERING FUNCTIONS ---
        function renderFinanzas() {
            const ui = document.getElementById('lista-transacciones');
            if(!ui) return;
            ui.innerHTML = '';
            let i=0, e=0;
            transacciones.forEach(t => {
                if(!t.soloHistorial) { t.tipo === 'ingreso' ? i += t.monto : e += t.monto; }
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm";
                
                const subtext = t.fechaClase ? 
                    `<span class="text-indigo-500 font-black">CLASE DEL: ${t.fechaClase}</span>` : 
                    `FECHA: ${t.fechaPago}`;

                card.innerHTML = `
                    <div class="flex-1">
                        <p class="text-[10px] font-black text-slate-800 uppercase leading-tight">${t.descripcion}</p>
                        <p class="text-[8px] font-bold text-slate-400 uppercase mt-1">
                            RECIBO: ${t.fechaPago} • ${subtext}
                        </p>
                    </div>
                    <div class="text-right ml-4">
                        <p class="font-black text-sm ${t.tipo === 'ingreso' ? 'text-emerald-500' : 'text-rose-500'} ${t.soloHistorial ? 'opacity-30' : ''}">$${t.monto}</p>
                        <button onclick="window.eliminarDoc('transacciones', '${t.id}')" class="text-[8px] font-bold text-slate-300 uppercase">Borrar</button>
                    </div>
                `;
                ui.appendChild(card);
            });
            document.getElementById('total-ingresos').innerText = `$${i.toLocaleString()}`;
            document.getElementById('total-egresos').innerText = `$${e.toLocaleString()}`;
            document.getElementById('total-balance').innerText = `$${(i-e).toLocaleString()}`;
        }

        window.renderAlumnos = () => {
            const ui = document.getElementById('ui-alumnos');
            if(!ui) return;
            const hoy = new Date();
            ui.innerHTML = alumnos.map(a => {
                const transAlumno = transacciones.filter(t => t.alumno === a.nombre && t.categoria === 'ingreso-clase');
                const pagadas = transAlumno.length;
                const cursoRelacionado = cursos.find(c => c.nombre === a.curso);
                
                let estadoHTML = '';
                if(a.fechaInicio){
                    const fInicio = new Date(a.fechaInicio + "T00:00:00");
                    let diffSemanas = Math.floor((hoy - fInicio) / (1000 * 60 * 60 * 24 * 7)) + 1;
                    
                    if(cursoRelacionado && cursoRelacionado.fechasInactivas) {
                        const inactv = JSON.parse(cursoRelacionado.fechasInactivas);
                        inactv.forEach(fechaStr => {
                            const fInac = new Date(fechaStr + "T00:00:00");
                            if(fInac >= fInicio && fInac <= hoy) {
                                diffSemanas--;
                            }
                        });
                    }

                    const debe = diffSemanas - pagadas;
                    if(debe <= 0) {
                        estadoHTML = `<span class="bg-emerald-100 text-emerald-600 px-2 py-1 rounded-md text-[8px] font-black uppercase">Al Corriente</span>`;
                    } else {
                        estadoHTML = `<span class="bg-rose-100 text-rose-600 px-2 py-1 rounded-md text-[8px] font-black uppercase">Debe ${debe} ${debe === 1 ? 'Clase' : 'Clases'}</span>`;
                    }
                }

                return `
                <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm card-alumno">
                    <div class="flex justify-between items-start">
                        <div onclick="window.verHistorial('${a.nombre}')" class="flex-1 cursor-pointer">
                            <div class="flex items-center gap-2">
                                <p class="font-black text-sm text-indigo-950 uppercase">${a.nombre}</p>
                                ${estadoHTML}
                            </div>
                            <p class="text-[9px] font-black text-indigo-500 uppercase mt-1">${a.curso || 'Sin curso'}</p>
                            <div class="mt-3 flex flex-wrap gap-3">
                                <span class="text-[8px] font-bold text-slate-400">TEL: ${a.telefono || '---'}</span>
                                <span class="text-[8px] font-bold text-slate-400">PAGADAS: ${pagadas}</span>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <button onclick="window.prepararEdicionAlum('${a.id}')" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-[9px] font-black uppercase">Editar</button>
                            <button onclick="window.eliminarDoc('alumnos', '${a.id}')" class="text-rose-300 text-[8px] font-bold uppercase">Borrar</button>
                        </div>
                    </div>
                </div>
            `;}).join('');
        };

        window.renderCursos = () => {
            const ui = document.getElementById('ui-cursos');
            if(!ui) return;
            ui.innerHTML = cursos.map(c => `
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center">
                    <div class="cursor-pointer flex-1" onclick="window.prepararEdicionCurso('${c.id}')">
                        <p class="font-black text-sm text-slate-800 uppercase">${c.nombre}</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">${c.duracion} Sesiones • $${c.costo}</p>
                        ${c.fechaInicio ? `<p class="text-[9px] font-bold text-indigo-500 uppercase mt-1">INICIA: ${c.fechaInicio} | TERMINA: ${c.fechaTermino || 'N/A'}</p>` : ''}
                        ${c.fechasInactivas && JSON.parse(c.fechasInactivas).length > 0 ? 
                            `<p class="text-[7px] text-rose-400 font-bold uppercase mt-1">${JSON.parse(c.fechasInactivas).length} fechas sin clase registradas</p>` : ''}
                    </div>
                    <button onclick="window.eliminarDoc('cursos', '${c.id}')" class="text-rose-300 text-[8px] font-bold uppercase">Borrar</button>
                </div>
            `).join('');
        };

        function populateSelects() {
            const sA = document.getElementById('select-alumno');
            if(sA) sA.innerHTML = '<option value="">Selecciona Alumno...</option>' + alumnos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            const sC = document.getElementById('select-curso-alumno');
            if(sC) sC.innerHTML = '<option value="">Selecciona Curso...</option>' + cursos.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
        }

        // --- UI ACTIONS ---
        window.switchTab = (t) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`sec-${t}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`btn-${t}`).classList.add('tab-active');
        };

        window.toggleFields = () => {
            const val = document.getElementById('categoria').value;
            document.getElementById('fields-alumno').classList.toggle('hidden', val !== 'ingreso-clase');
        };

        window.eliminarDoc = async (c, id) => { 
            if(confirm("¿Estás seguro de eliminar este registro? Esta acción no se puede deshacer.")) {
                await deleteDoc(doc(db, c, id)); 
            }
        };

        window.verHistorial = (n) => {
            const p = transacciones.filter(t => t.alumno === n);
            document.getElementById('modal-nombre').innerText = n;
            document.getElementById('modal-content').innerHTML = p.length > 0 ? p.map(x => `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between shadow-sm">
                    <div>
                        <p class="text-[10px] font-black uppercase text-indigo-900 leading-tight">
                            ${x.categoria === 'ingreso-clase' ? 'SESIÓN ' + x.numSesion : x.descripcion}
                        </p>
                        <p class="text-[8px] text-slate-400 font-bold mt-1">
                            PAGADO: ${x.fechaPago} ${x.fechaClase ? '• CLASE: '+x.fechaClase : ''}
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-sm text-indigo-600">$${x.monto}</p>
                    </div>
                </div>
            `).join('') : '<p class="text-center text-slate-400 py-10 font-bold uppercase text-[10px]">Sin movimientos registrados</p>';
            document.getElementById('modal-historial').classList.remove('hidden');
        };

        window.cerrarModal = () => document.getElementById('modal-historial').classList.add('hidden');

        // --- NUEVA LÓGICA DE CÁLCULO DE FECHAS ---
        window.calcularFechaTermino = () => {
            const fechaInicioStr = document.getElementById('fecha-inicio-curso').value;
            const duracion = parseInt(document.getElementById('duracion-curso').value);
            const fechasInactivasJson = document.getElementById('fechas-inactivas-json').value;
            const fechasInactivas = fechasInactivasJson ? JSON.parse(fechasInactivasJson) : [];

            if (!fechaInicioStr || isNaN(duracion) || duracion <= 0) {
                document.getElementById('fecha-termino-curso').value = '';
                return;
            }

            let fechaActual = new Date(fechaInicioStr + "T00:00:00");
            let sesionesContadas = 1; // La primera sesión es el día de inicio marcado

            // Saltarse la fecha inicial si por error se marca como inactiva
            while (fechasInactivas.includes(fechaActual.toISOString().split('T')[0])) {
                fechaActual.setDate(fechaActual.getDate() + 7);
            }

            while (sesionesContadas < duracion) {
                fechaActual.setDate(fechaActual.getDate() + 7);
                let strFecha = fechaActual.toISOString().split('T')[0];
                if (!fechasInactivas.includes(strFecha)) {
                    sesionesContadas++;
                }
            }

            document.getElementById('fecha-termino-curso').value = fechaActual.toISOString().split('T')[0];
        };

        // --- FORM HANDLING ---
        window.agregarFechaSinClase = () => {
            const fInput = document.getElementById('fecha-sin-clase');
            const listaJson = document.getElementById('fechas-inactivas-json');
            if(!fInput.value) return;

            let fechas = JSON.parse(listaJson.value || "[]");
            if(!fechas.includes(fInput.value)) {
                fechas.push(fInput.value);
                listaJson.value = JSON.stringify(fechas);
                actualizarListaVisualInactivas(fechas);
                window.calcularFechaTermino(); // Recalcular al agregar fecha libre
            }
            fInput.value = "";
        };

        window.quitarFechaSinClase = (f) => {
            const listaJson = document.getElementById('fechas-inactivas-json');
            let fechas = JSON.parse(listaJson.value || "[]");
            fechas = fechas.filter(x => x !== f);
            listaJson.value = JSON.stringify(fechas);
            actualizarListaVisualInactivas(fechas);
            window.calcularFechaTermino(); // Recalcular al quitar fecha libre
        };

        function actualizarListaVisualInactivas(fechas) {
            const container = document.getElementById('lista-fechas-inactivas');
            if(!container) return;
            container.innerHTML = fechas.map(f => `
                <div class="bg-rose-100 text-rose-600 px-2 py-1 rounded-lg text-[8px] font-black flex items-center gap-1">
                    ${f} <span onclick="window.quitarFechaSinClase('${f}')" class="text-[10px] cursor-pointer">×</span>
                </div>
            `).join('');
        }

        window.autoSugerirSesionYFecha = () => {
            const nombre = document.getElementById('select-alumno').value;
            const a = alumnos.find(x => x.nombre === nombre);
            if (!a) return;
            
            const c = cursos.find(x => x.nombre === a.curso);
            const pagadas = transacciones.filter(t => t.alumno === nombre && t.categoria === 'ingreso-clase').length;
            
            document.getElementById('num-sesion').value = pagadas + 1;
            document.getElementById('monto').value = c ? c.costo : 0;

            if(a.fechaInicio) {
                let fechaBase = new Date(a.fechaInicio + "T00:00:00");
                let fechasInactivas = c?.fechasInactivas ? JSON.parse(c.fechasInactivas) : [];
                
                let clasesPorSaltar = pagadas;
                let fechaSugerida = new Date(fechaBase);

                let clasesContadas = 0;
                while (clasesContadas < clasesPorSaltar) {
                    fechaSugerida.setDate(fechaSugerida.getDate() + 7);
                    let strFecha = fechaSugerida.toISOString().split('T')[0];
                    if (!fechasInactivas.includes(strFecha)) {
                        clasesContadas++;
                    }
                }

                while (fechasInactivas.includes(fechaSugerida.toISOString().split('T')[0])) {
                    fechaSugerida.setDate(fechaSugerida.getDate() + 7);
                }

                document.getElementById('fecha-clase-corresponde').value = fechaSugerida.toISOString().split('T')[0];
            }
        };

        window.prepararEdicionAlum = (id) => {
            const a = alumnos.find(x => x.id === id);
            if(!a) return;
            switchTab('gestion');
            document.getElementById('edit-id-alumno').value = a.id;
            document.getElementById('nombre-alumno').value = a.nombre;
            document.getElementById('select-curso-alumno').value = a.curso || '';
            document.getElementById('curp-alumno').value = a.curp || '';
            document.getElementById('tel-alumno').value = a.telefono || '';
            document.getElementById('fecha-inicio-alumno').value = a.fechaInicio || '';
            document.getElementById('form-alumno-title').innerText = "Editando: " + a.nombre;
            document.getElementById('btn-submit-alumno').innerText = "Actualizar Alumno";
            document.getElementById('btn-cancelar-edit').classList.remove('hidden');
        };

        window.cancelarEdicionAlum = () => {
            document.getElementById('alumno-form').reset();
            document.getElementById('edit-id-alumno').value = "";
            document.getElementById('form-alumno-title').innerText = "Registro / Edición de Alumno";
            document.getElementById('btn-submit-alumno').innerText = "Guardar Alumno";
            document.getElementById('btn-cancelar-edit').classList.add('hidden');
        };

        window.prepararEdicionCurso = (id) => {
            const c = cursos.find(x => x.id === id);
            if(!c) return;
            switchTab('cursos');
            document.getElementById('edit-id-curso').value = c.id;
            document.getElementById('nombre-curso').value = c.nombre;
            document.getElementById('duracion-curso').value = c.duracion;
            document.getElementById('costo-clase').value = c.costo;
            
            // Cargar nuevas fechas
            document.getElementById('fecha-inicio-curso').value = c.fechaInicio || '';
            document.getElementById('fecha-termino-curso').value = c.fechaTermino || '';
            
            const fechas = c.fechasInactivas ? JSON.parse(c.fechasInactivas) : [];
            document.getElementById('fechas-inactivas-json').value = JSON.stringify(fechas);
            actualizarListaVisualInactivas(fechas);

            document.getElementById('form-curso-title').innerText = "Editando: " + c.nombre;
            document.getElementById('btn-submit-curso').innerText = "Actualizar";
            document.getElementById('btn-cancelar-curso').classList.remove('hidden');
        };

        window.cancelarEdicionCurso = () => {
            document.getElementById('curso-form').reset();
            document.getElementById('edit-id-curso').value = "";
            document.getElementById('fechas-inactivas-json').value = "[]";
            document.getElementById('lista-fechas-inactivas').innerHTML = "";
            document.getElementById('form-curso-title').innerText = "Nuevo Diplomado";
            document.getElementById('btn-submit-curso').innerText = "Guardar Curso";
            document.getElementById('btn-cancelar-curso').classList.add('hidden');
        };

        // --- FORM SUBMIT HANDLERS ---
        document.getElementById('alumno-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id-alumno').value;
            const data = {
                nombre: document.getElementById('nombre-alumno').value.trim(),
                curso: document.getElementById('select-curso-alumno').value,
                curp: document.getElementById('curp-alumno').value.trim(),
                telefono: document.getElementById('tel-alumno').value.trim(),
                fechaInicio: document.getElementById('fecha-inicio-alumno').value
            };
            id ? await updateDoc(doc(db, "alumnos", id), data) : await addDoc(collection(db, "alumnos"), data);
            cancelarEdicionAlum();
        };

        // LÓGICA COMPLETADA DEL FORMULARIO DE CURSOS (Aquí se cortó tu mensaje)
        document.getElementById('curso-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id-curso').value;
            const data = {
                nombre: document.getElementById('nombre-curso').value.trim(),
                duracion: parseInt(document.getElementById('duracion-curso').value),
                costo: parseFloat(document.getElementById('costo-clase').value),
                fechasInactivas: document.getElementById('fechas-inactivas-json').value,
                fechaInicio: document.getElementById('fecha-inicio-curso').value, // Se guarda inicio
                fechaTermino: document.getElementById('fecha-termino-curso').value // Se guarda término calculado
            };
            id ? await updateDoc(doc(db, "cursos", id), data) : await addDoc(collection(db, "cursos"), data);
            cancelarEdicionCurso();
        };

        // LÓGICA COMPLETADA DEL FORMULARIO DE FINANZAS
        document.getElementById('finance-form').onsubmit = async (e) => {
            e.preventDefault();
            const tipoCategoria = document.getElementById('categoria').value;
            const tipo = tipoCategoria.startsWith('ingreso') ? 'ingreso' : 'egreso';
            
            const data = {
                categoria: tipoCategoria,
                tipo: tipo,
                descripcion: document.getElementById('descripcion').value.trim() || document.getElementById('categoria').options[document.getElementById('categoria').selectedIndex].text,
                monto: parseFloat(document.getElementById('monto').value),
                fechaPago: document.getElementById('fecha-pago-real').value,
                soloHistorial: document.getElementById('solo-historial').checked,
                timestamp: new Date().toISOString()
            };

            if(tipoCategoria === 'ingreso-clase') {
                data.alumno = document.getElementById('select-alumno').value;
                data.numSesion = parseInt(document.getElementById('num-sesion').value);
                data.fechaClase = document.getElementById('fecha-clase-corresponde').value;
            }

            await addDoc(collection(db, "transacciones"), data);
            document.getElementById('finance-form').reset();
            document.getElementById('solo-historial').checked = false;
            autoSugerirSesionYFecha();
        };

        // Set default date for new transactions
        document.getElementById('fecha-pago-real').valueAsDate = new Date();

    </script>
</body>
</html>
