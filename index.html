<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SullyBec App">
    <title>SullyBec Instituto - Gestión</title>
    
    <!-- Iconos para móvil -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1077/1077976.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1077/1077976.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --primary-color: #6366f1; /* Indigo */
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            padding-top: var(--safe-area-top);
            padding-bottom: var(--safe-area-bottom);
            -webkit-tap-highlight-color: transparent;
        }

        .tab-active { color: var(--primary-color); font-weight: 800; border-bottom: 3px solid var(--primary-color); }
        
        input, select, button { font-size: 16px !important; }
        
        .balance-card { 
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }

        .logo-img {
            height: 36px;
            width: auto;
            object-fit: contain;
        }

        /* Animación para el estatus */
        .dot-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 overflow-x-hidden">

    <!-- Header Personalizado SullyBec -->
    <div class="sticky-header px-4 py-3 border-b border-slate-200">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <div class="flex items-center gap-3">
                <!-- CONTENEDOR DEL LOGO -->
                <div id="logo-container" class="bg-white border border-slate-100 p-1 rounded-lg overflow-hidden flex items-center justify-center shadow-sm" style="width: 44px; height: 44px;">
                    <img id="main-logo" src="" alt="SullyBec Logo" class="logo-img">
                </div>
                <h1 class="text-lg font-extrabold tracking-tight text-indigo-950">SullyBec <span class="text-indigo-600">Instituto</span></h1>
            </div>
            <div class="flex flex-col items-end">
                <div class="flex items-center gap-1.5">
                    <span id="cloud-status" class="w-2 h-2 rounded-full bg-amber-400 dot-pulse"></span>
                    <p id="status-text" class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Cargando</p>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 pt-4 pb-24">
        <!-- Saldo Disponible -->
        <div class="balance-card p-6 rounded-[2rem] text-white mb-6 relative overflow-hidden">
            <div class="relative z-10">
                <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest">Saldo Institucional Actual</p>
                <h2 id="total-balance" class="text-4xl font-black mt-1">$0</h2>
                
                <div class="flex justify-between mt-6 pt-6 border-t border-white/20">
                    <div>
                        <p class="text-[9px] font-bold opacity-70 uppercase">Total Ingresos</p>
                        <p id="total-ingresos" class="text-lg font-bold text-emerald-300">$0</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] font-bold opacity-70 uppercase">Total Egresos</p>
                        <p id="total-egresos" class="text-lg font-bold text-rose-300">$0</p>
                    </div>
                </div>
            </div>
            <div class="absolute -right-8 -top-8 w-32 h-32 bg-white/10 rounded-full"></div>
        </div>

        <!-- Navegación -->
        <nav class="flex mb-6 bg-white p-1 rounded-2xl shadow-sm border border-slate-200">
            <button onclick="switchTab('finanzas')" id="btn-finanzas" class="flex-1 py-3 text-[10px] font-black uppercase tracking-widest tab-active transition-all">Contabilidad</button>
            <button onclick="switchTab('alumnos')" id="btn-alumnos" class="flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-slate-400 transition-all">Alumnos</button>
        </nav>

        <!-- SECCIÓN FINANZAS -->
        <section id="sec-finanzas" class="space-y-6">
            <div class="flex items-center justify-between px-1">
                <input type="date" id="filtro-fecha" class="bg-white border-slate-200 rounded-xl px-3 py-2 text-xs font-bold shadow-sm outline-none">
                <p id="resumen-dia" class="text-[10px] font-black text-indigo-500 bg-indigo-50 px-3 py-2 rounded-lg"></p>
            </div>

            <div id="container-form" class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Añadir Operación</h3>
                <form id="finance-form" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Fecha</label>
                            <input type="date" id="fecha" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Monto ($)</label>
                            <input type="number" id="monto" step="0.01" placeholder="0.00" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Categoría</label>
                        <select id="categoria" onchange="checkCategoryFields()" class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm appearance-none">
                            <optgroup label="Ingresos">
                                <option value="ingreso-clase">Pago Alumno (Diplomado)</option>
                                <option value="ingreso-taller">Pago Taller / Curso</option>
                                <option value="ingreso-paciente">Atención Paciente</option>
                                <option value="ingreso-otro">Otro Ingreso</option>
                            </optgroup>
                            <optgroup label="Egresos">
                                <option value="egreso-profesor">Pago Profesor</option>
                                <option value="egreso-insumos">Materiales / Insumos</option>
                                <option value="egreso-renta">Gastos Operativos</option>
                                <option value="egreso-otros">Otros Gastos</option>
                            </optgroup>
                        </select>
                    </div>

                    <div id="wrapper-alumno-extra" class="bg-indigo-50 p-4 rounded-2xl space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="select-alumno" class="w-full bg-white border-none rounded-lg p-2 text-xs font-bold"></select>
                            <select id="select-curso" class="w-full bg-white border-none rounded-lg p-2 text-xs font-bold"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="sesion-numero" placeholder="# Sesión" class="w-full bg-white border-none rounded-lg p-2 text-xs font-bold">
                            <input type="text" id="mes-pagado" placeholder="Mes" class="w-full bg-white border-none rounded-lg p-2 text-xs font-bold">
                        </div>
                    </div>

                    <div id="wrapper-taller-extra" class="hidden bg-emerald-50 p-4 rounded-2xl space-y-3">
                        <input type="text" id="taller-alumno-nombre" placeholder="Nombre Alumno" class="w-full bg-white border-none rounded-lg p-2 text-xs font-bold">
                        <input type="text" id="taller-evento-nombre" placeholder="Nombre del Taller" class="w-full bg-white border-none rounded-lg p-2 text-xs font-bold">
                    </div>

                    <input type="text" id="descripcion" placeholder="Nota adicional" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">

                    <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase text-xs tracking-widest active:scale-[0.98] transition-all">Guardar Registro</button>
                </form>
            </div>

            <div class="space-y-3">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-2">Movimientos del Día</h3>
                <div id="lista-transacciones" class="space-y-2"></div>
            </div>
        </section>

        <!-- SECCIÓN ALUMNOS -->
        <section id="sec-alumnos" class="hidden space-y-6">
            <div class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Registrar Alumno Nuevo</h3>
                <form id="alumno-form" class="space-y-3">
                    <input type="text" id="nombre-alumno" placeholder="Nombre Completo" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="curp-alumno" placeholder="Identificación" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm uppercase">
                        <input type="tel" id="tel-alumno" placeholder="WhatsApp" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-widest">Crear Ficha</button>
                </form>
            </div>
            <div id="ui-alumnos" class="grid grid-cols-1 gap-2"></div>
        </section>
    </div>

    <!-- Modal Historial -->
    <div id="modal-historial" class="fixed inset-0 bg-white z-[100] hidden flex flex-col">
        <div class="p-6 bg-indigo-700 text-white flex justify-between items-end pb-8">
            <div>
                <h2 id="modal-titulo-alumno" class="text-2xl font-black italic">Nombre</h2>
                <p id="modal-subtitulo-alumno" class="text-[9px] font-black opacity-70 uppercase tracking-[0.2em] mt-1">SullyBec Instituto</p>
            </div>
            <button onclick="cerrarModal()" class="bg-white/20 p-3 rounded-2xl">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2"/></svg>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-6 space-y-3 bg-slate-50" id="modal-lista-pagos"></div>
        <div class="p-6 bg-white border-t border-slate-100 flex justify-between items-center shadow-[0_-4px_10px_rgba(0,0,0,0.03)]">
            <span class="text-xs font-black text-slate-400 uppercase">Aportación Total</span>
            <span id="modal-total-alumno" class="text-2xl font-black text-indigo-600">$0</span>
        </div>
    </div>

    <script type="module">
        // --- CONFIGURACIÓN DEL LOGO SULLYBEC ---
        // Se utiliza un convertidor de enlace para que Drive permita la visualización directa
        const URL_MI_LOGO = "https://lh3.googleusercontent.com/d/1gjM8QJhfynpT0il86P3IRWwD_wMQWcCC"; 
        
        document.getElementById('main-logo').src = URL_MI_LOGO;

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCcAda5-ewiR78bfLyYrjEMhfdc0RFxd7s",
          authDomain: "finanzas-escuela.firebaseapp.com",
          projectId: "finanzas-escuela",
          storageBucket: "finanzas-escuela.firebasestorage.app",
          messagingSenderId: "106864276061",
          appId: "1:106864276061:web:cc8b26cca0ef07088f13b4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const transColl = collection(db, "transacciones");
        const alumColl = collection(db, "alumnos");
        const cursoColl = collection(db, "cursos");

        let transacciones = [], alumnos = [], cursos = [];

        onSnapshot(query(transColl, orderBy("timestamp", "desc")), (snap) => {
            transacciones = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderFinanzas();
            setConnected();
        });

        onSnapshot(query(alumColl, orderBy("nombre", "asc")), (snap) => {
            alumnos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderAlumnos();
            populateSelectors();
        });

        onSnapshot(query(cursoColl, orderBy("nombre", "asc")), (snap) => {
            cursos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            populateSelectors();
        });

        function setConnected() {
            const pill = document.getElementById('cloud-status');
            pill.className = "w-2 h-2 rounded-full bg-emerald-500";
            document.getElementById('status-text').innerText = "Sincronizado";
        }

        function renderFinanzas() {
            const ui = document.getElementById('lista-transacciones');
            ui.innerHTML = '';
            const filtro = document.getElementById('filtro-fecha').value;
            let ing = 0, egr = 0, diaTotal = 0;

            transacciones.forEach(t => {
                const m = parseFloat(t.monto);
                if(t.tipo === 'ingreso') ing += m; else egr += m;
                
                if(t.fecha === filtro) {
                    diaTotal += (t.tipo === 'ingreso' ? m : -m);
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center";
                    card.innerHTML = `
                        <div class="flex-1">
                            <p class="text-[11px] font-black text-slate-800 uppercase tracking-tight">${t.descripcion}</p>
                            <p class="text-[8px] font-bold text-indigo-400 uppercase mt-1">${t.categoria}</p>
                        </div>
                        <div class="text-right ml-4">
                            <p class="font-black text-sm ${t.tipo === 'ingreso' ? 'text-emerald-600' : 'text-rose-500'}">
                                ${t.tipo === 'ingreso' ? '+' : '-'}$${m.toLocaleString()}
                            </p>
                        </div>
                    `;
                    ui.appendChild(card);
                }
            });

            if(ui.innerHTML === '') ui.innerHTML = `<div class="text-center py-8 text-slate-300 font-bold uppercase text-[9px] tracking-widest">No hay movimientos registrados hoy</div>`;

            document.getElementById('total-ingresos').innerText = `$${ing.toLocaleString()}`;
            document.getElementById('total-egresos').innerText = `$${egr.toLocaleString()}`;
            document.getElementById('total-balance').innerText = `$${(ing - egr).toLocaleString()}`;
            document.getElementById('resumen-dia').innerText = `Balance: $${diaTotal.toLocaleString()}`;
        }

        function renderAlumnos() {
            const ui = document.getElementById('ui-alumnos');
            ui.innerHTML = alumnos.map(a => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center" onclick="verHistorial('${a.id}')">
                    <div>
                        <p class="font-black text-indigo-950 text-sm">${a.nombre}</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">${a.tel || 'Sin Contacto'}</p>
                    </div>
                    <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="2"/></svg>
                </div>
            `).join('');
        }

        window.switchTab = (tab) => {
            const isF = tab === 'finanzas';
            document.getElementById('sec-finanzas').classList.toggle('hidden', !isF);
            document.getElementById('sec-alumnos').classList.toggle('hidden', isF);
            document.getElementById('btn-finanzas').className = isF ? 'flex-1 py-3 text-[10px] font-black uppercase tracking-widest tab-active' : 'flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-slate-400';
            document.getElementById('btn-alumnos').className = !isF ? 'flex-1 py-3 text-[10px] font-black uppercase tracking-widest tab-active' : 'flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-slate-400';
        };

        window.checkCategoryFields = () => {
            const v = document.getElementById('categoria').value;
            document.getElementById('wrapper-alumno-extra').classList.toggle('hidden', v !== 'ingreso-clase');
            document.getElementById('wrapper-taller-extra').classList.toggle('hidden', v !== 'ingreso-taller');
        };

        window.verHistorial = (id) => {
            const a = alumnos.find(x => x.id === id);
            if(!a) return;
            document.getElementById('modal-titulo-alumno').innerText = a.nombre;
            const pagos = transacciones.filter(t => t.alumnoRel === a.nombre);
            let total = 0;
            document.getElementById('modal-lista-pagos').innerHTML = pagos.map(p => {
                total += p.monto;
                return `<div class="bg-white p-4 rounded-xl border border-slate-200 flex justify-between items-center">
                            <div><p class="text-[10px] font-black uppercase text-slate-700">${p.descripcion.replace('[PAGO] ', '')}</p>
                            <p class="text-[8px] font-bold text-slate-400 uppercase">${p.fecha}</p></div>
                            <p class="font-black text-indigo-600">$${p.monto.toLocaleString()}</p></div>`;
            }).join('') || '<p class="text-center text-slate-400 text-xs py-10">Sin historial de pagos</p>';
            document.getElementById('modal-total-alumno').innerText = `$${total.toLocaleString()}`;
            document.getElementById('modal-historial').classList.remove('hidden');
        };

        window.cerrarModal = () => document.getElementById('modal-historial').classList.add('hidden');

        document.getElementById('finance-form').onsubmit = async (e) => {
            e.preventDefault();
            const cat = document.getElementById('categoria').value;
            const monto = parseFloat(document.getElementById('monto').value);
            const fecha = document.getElementById('fecha').value;
            const nota = document.getElementById('descripcion').value;
            let data = { fecha, categoria: cat, tipo: cat.startsWith('ingreso') ? 'ingreso' : 'egreso', monto, timestamp: Date.now() };

            if(cat === 'ingreso-clase') {
                const al = document.getElementById('select-alumno').value;
                const cu = document.getElementById('select-curso').value;
                data.alumnoRel = al;
                data.descripcion = `[PAGO] ${al} - ${cu}`;
            } else if(cat === 'ingreso-taller') {
                data.descripcion = `[TALLER] ${document.getElementById('taller-evento-nombre').value}`;
            } else {
                data.descripcion = nota || cat;
            }

            await addDoc(transColl, data);
            document.getElementById('monto').value = '';
        };

        document.getElementById('alumno-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(alumColl, {
                nombre: document.getElementById('nombre-alumno').value,
                curp: document.getElementById('curp-alumno').value,
                tel: document.getElementById('tel-alumno').value
            });
            document.getElementById('alumno-form').reset();
            alert('Alumno registrado en SullyBec');
        };

        function populateSelectors() {
            document.getElementById('select-alumno').innerHTML = alumnos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            document.getElementById('select-curso').innerHTML = ["Diplomado Terapias", "Curso Masaje", "Taller Cuencos"].map(c => `<option value="${c}">${c}</option>`).join('');
        }

        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fecha').value = hoy;
        document.getElementById('filtro-fecha').value = hoy;
        document.getElementById('filtro-fecha').onchange = renderFinanzas;
        checkCategoryFields();
    </script>
</body>
</html>
