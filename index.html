<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SullyBec App">
    <title>SullyBec Instituto - Gestión</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --primary-color: #6366f1;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            padding-top: var(--safe-area-top);
            padding-bottom: var(--safe-area-bottom);
            -webkit-tap-highlight-color: transparent;
        }

        .tab-active { color: var(--primary-color); font-weight: 800; border-bottom: 3px solid var(--primary-color); }
        
        .balance-card { 
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }

        .logo-img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        .dot-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 overflow-x-hidden">

    <!-- Header -->
    <div class="sticky-header px-4 py-3 border-b border-slate-200">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="bg-white border border-slate-100 p-1 rounded-lg overflow-hidden flex items-center justify-center shadow-sm" style="width: 42px; height: 42px;">
                    <img id="main-logo" src="https://lh3.googleusercontent.com/d/1gjM8QJhfynpT0il86P3IRWwD_wMQWcCC" alt="SullyBec Logo" class="logo-img">
                </div>
                <h1 class="text-lg font-extrabold tracking-tight text-indigo-950">SullyBec <span class="text-indigo-600">Instituto</span></h1>
            </div>
            <div class="flex flex-col items-end">
                <div class="flex items-center gap-1.5">
                    <span id="cloud-status" class="w-2 h-2 rounded-full bg-amber-400 dot-pulse"></span>
                    <p id="status-text" class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Conectando</p>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 pt-4 pb-24">
        <!-- Saldo -->
        <div class="balance-card p-6 rounded-[2rem] text-white mb-6 relative overflow-hidden">
            <div class="relative z-10">
                <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest text-indigo-100">Saldo Institucional</p>
                <h2 id="total-balance" class="text-4xl font-black mt-1">$0</h2>
                
                <div class="flex justify-between mt-6 pt-6 border-t border-white/20">
                    <div>
                        <p class="text-[9px] font-bold opacity-70 uppercase">Ingresos</p>
                        <p id="total-ingresos" class="text-lg font-bold text-emerald-300">$0</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] font-bold opacity-70 uppercase">Egresos</p>
                        <p id="total-egresos" class="text-lg font-bold text-rose-300">$0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navegación -->
        <nav class="flex mb-6 bg-white p-1 rounded-2xl shadow-sm border border-slate-200">
            <button onclick="switchTab('finanzas')" id="btn-finanzas" class="flex-1 py-3 text-[10px] font-black uppercase tracking-widest tab-active">Contabilidad</button>
            <button onclick="switchTab('alumnos')" id="btn-alumnos" class="flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-slate-400">Alumnos</button>
        </nav>

        <!-- SECCIÓN FINANZAS -->
        <section id="sec-finanzas" class="space-y-6">
            <div id="container-form" class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 text-center">Registrar Nueva Operación</h3>
                <form id="finance-form" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Fecha</label>
                            <input type="date" id="fecha" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Monto ($)</label>
                            <input type="number" id="monto" step="0.01" placeholder="0.00" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Categoría de Movimiento</label>
                        <select id="categoria" onchange="checkCategoryFields()" class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm appearance-none">
                            <optgroup label="Ingresos Institucionales">
                                <option value="ingreso-clase">Cobro de Diplomado / Mensualidad</option>
                                <option value="ingreso-taller">Cobro de Taller / Curso Corto</option>
                                <option value="ingreso-paciente">Atención Clínica / Paciente</option>
                                <option value="ingreso-otro">Otro Ingreso</option>
                            </optgroup>
                            <optgroup label="Egresos y Gastos">
                                <option value="egreso-profesor">Pago a Docente / Ponente</option>
                                <option value="egreso-insumos">Material de Práctica / Insumos</option>
                                <option value="egreso-renta">Servicios / Renta / Limpieza</option>
                                <option value="egreso-otros">Otros Gastos</option>
                            </optgroup>
                        </select>
                    </div>

                    <!-- Campos Dinámicos para Alumnos/Diplomados -->
                    <div id="wrapper-alumno-extra" class="bg-indigo-50/50 p-4 rounded-2xl space-y-3 border border-indigo-100">
                        <div class="space-y-2">
                            <label class="block text-[9px] font-bold text-indigo-400 uppercase">Seleccionar Alumno</label>
                            <select id="select-alumno" class="w-full bg-white border-none rounded-lg p-2 text-xs font-bold shadow-sm"></select>
                        </div>
                        <div class="grid grid-cols-1 gap-2">
                            <label class="block text-[9px] font-bold text-indigo-400 uppercase">Diplomado y Duración</label>
                            <select id="select-curso" class="w-full bg-white border-none rounded-lg p-2 text-xs font-bold shadow-sm"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="sesion-numero" placeholder="N° de Sesión" class="w-full bg-white border-none rounded-lg p-2 text-xs font-bold shadow-sm">
                            <input type="text" id="mes-pagado" placeholder="Mes a cubrir" class="w-full bg-white border-none rounded-lg p-2 text-xs font-bold shadow-sm">
                        </div>
                    </div>

                    <!-- Campos Dinámicos para Talleres -->
                    <div id="wrapper-taller-extra" class="hidden bg-emerald-50/50 p-4 rounded-2xl space-y-3 border border-emerald-100">
                        <input type="text" id="taller-alumno-nombre" placeholder="Nombre del Alumno" class="w-full bg-white border-none rounded-lg p-2 text-xs font-bold shadow-sm">
                        <select id="select-taller" class="w-full bg-white border-none rounded-lg p-2 text-xs font-bold shadow-sm"></select>
                    </div>

                    <input type="text" id="descripcion" placeholder="Notas adicionales del registro..." class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">

                    <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase text-xs tracking-widest active:scale-[0.98] transition-all">Registrar en Sistema</button>
                </form>
            </div>

            <div class="space-y-4">
                <div class="flex items-center justify-between px-2">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Historial Reciente</h3>
                    <input type="date" id="filtro-fecha" class="bg-slate-200 border-none rounded-lg px-2 py-1 text-[10px] font-bold outline-none">
                </div>
                <div id="lista-transacciones" class="space-y-2"></div>
            </div>
        </section>

        <!-- SECCIÓN ALUMNOS -->
        <section id="sec-alumnos" class="hidden space-y-6">
            <div class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Alta de Alumno Nuevo</h3>
                <form id="alumno-form" class="space-y-3">
                    <input type="text" id="nombre-alumno" placeholder="Nombre Completo" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="curp-alumno" placeholder="Matrícula / CURP" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm uppercase">
                        <input type="tel" id="tel-alumno" placeholder="Teléfono" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-widest">Registrar Alumno</button>
                </form>
            </div>
            <div id="ui-alumnos" class="grid grid-cols-1 gap-2"></div>
        </section>
    </div>

    <!-- Modal -->
    <div id="modal-historial" class="fixed inset-0 bg-white z-[100] hidden flex flex-col">
        <div class="p-6 bg-indigo-700 text-white flex justify-between items-end">
            <div>
                <h2 id="modal-titulo-alumno" class="text-2xl font-black italic">Nombre</h2>
                <p class="text-[9px] font-black opacity-70 uppercase tracking-widest mt-1">Expediente de Pagos</p>
            </div>
            <button onclick="cerrarModal()" class="bg-white/20 p-2 rounded-xl">Cerrar</button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-2 bg-slate-50" id="modal-lista-pagos"></div>
        <div class="p-6 bg-white border-t border-slate-100 flex justify-between items-center">
            <span class="text-xs font-black text-slate-400 uppercase">Total Aportado</span>
            <span id="modal-total-alumno" class="text-2xl font-black text-indigo-600">$0</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Datos de Cursos y Talleres con Duración
        const CATALOGO_CURSOS = [
            { nombre: "Diplomado en Acupuntura Humana", duracion: "12 meses" },
            { nombre: "Diplomado en Quiropraxia", duracion: "10 meses" },
            { nombre: "Diplomado en Masoterapia", duracion: "8 meses" },
            { nombre: "Diplomado en Herbolaria", duracion: "6 meses" },
            { nombre: "Diplomado en Nutrición Natural", duracion: "9 meses" }
        ];

        const CATALOGO_TALLERES = [
            { nombre: "Taller de Ventosas", duracion: "5 horas" },
            { nombre: "Taller de Auriculoterapia", duracion: "1 día" },
            { nombre: "Taller de Vendaje Neuromuscular", duracion: "8 horas" },
            { nombre: "Taller de Flores de Bach", duracion: "2 días" }
        ];

        const firebaseConfig = {
          apiKey: "AIzaSyCcAda5-ewiR78bfLyYrjEMhfdc0RFxd7s",
          authDomain: "finanzas-escuela.firebaseapp.com",
          projectId: "finanzas-escuela",
          storageBucket: "finanzas-escuela.firebasestorage.app",
          messagingSenderId: "106864276061",
          appId: "1:106864276061:web:cc8b26cca0ef07088f13b4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const transColl = collection(db, "transacciones");
        const alumColl = collection(db, "alumnos");

        let transacciones = [], alumnos = [];

        onSnapshot(query(transColl, orderBy("timestamp", "desc")), (snap) => {
            transacciones = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderFinanzas();
            setConnected();
        });

        onSnapshot(query(alumColl, orderBy("nombre", "asc")), (snap) => {
            alumnos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderAlumnos();
            populateSelectors();
        });

        function setConnected() {
            document.getElementById('cloud-status').className = "w-2 h-2 rounded-full bg-emerald-500";
            document.getElementById('status-text').innerText = "Sincronizado";
        }

        function renderFinanzas() {
            const ui = document.getElementById('lista-transacciones');
            ui.innerHTML = '';
            const filtro = document.getElementById('filtro-fecha').value;
            let ing = 0, egr = 0;

            transacciones.forEach(t => {
                const m = parseFloat(t.monto);
                if(t.tipo === 'ingreso') ing += m; else egr += m;
                
                if(!filtro || t.fecha === filtro) {
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center";
                    card.innerHTML = `
                        <div class="flex-1">
                            <p class="text-[11px] font-black text-slate-800 uppercase leading-tight">${t.descripcion}</p>
                            <div class="flex gap-2 mt-1">
                                <span class="text-[8px] font-bold text-indigo-400 uppercase">${t.categoria}</span>
                                <span class="text-[8px] font-bold text-slate-300 uppercase">${t.fecha}</span>
                            </div>
                        </div>
                        <p class="font-black text-sm ${t.tipo === 'ingreso' ? 'text-emerald-500' : 'text-rose-500'} ml-3">
                            ${t.tipo === 'ingreso' ? '+' : '-'}$${m.toLocaleString()}
                        </p>
                    `;
                    ui.appendChild(card);
                }
            });

            document.getElementById('total-ingresos').innerText = `$${ing.toLocaleString()}`;
            document.getElementById('total-egresos').innerText = `$${egr.toLocaleString()}`;
            document.getElementById('total-balance').innerText = `$${(ing - egr).toLocaleString()}`;
        }

        function renderAlumnos() {
            document.getElementById('ui-alumnos').innerHTML = alumnos.map(a => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center" onclick="verHistorial('${a.id}')">
                    <div>
                        <p class="font-black text-indigo-950 text-sm">${a.nombre}</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">${a.tel || 'Sin Teléfono'}</p>
                    </div>
                    <span class="text-[10px] font-black text-indigo-300">VER FICHA</span>
                </div>
            `).join('');
        }

        function populateSelectors() {
            // Alumnos
            document.getElementById('select-alumno').innerHTML = alumnos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            
            // Cursos (Diplomados)
            document.getElementById('select-curso').innerHTML = CATALOGO_CURSOS.map(c => 
                `<option value="${c.nombre}">${c.nombre} (${c.duracion})</option>`
            ).join('');

            // Talleres
            document.getElementById('select-taller').innerHTML = CATALOGO_TALLERES.map(t => 
                `<option value="${t.nombre}">${t.nombre} (${t.duracion})</option>`
            ).join('');
        }

        window.switchTab = (tab) => {
            const isF = tab === 'finanzas';
            document.getElementById('sec-finanzas').classList.toggle('hidden', !isF);
            document.getElementById('sec-alumnos').classList.toggle('hidden', isF);
            document.getElementById('btn-finanzas').className = isF ? 'flex-1 py-3 text-[10px] font-black uppercase tracking-widest tab-active' : 'flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-slate-400';
            document.getElementById('btn-alumnos').className = !isF ? 'flex-1 py-3 text-[10px] font-black uppercase tracking-widest tab-active' : 'flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-slate-400';
        };

        window.checkCategoryFields = () => {
            const v = document.getElementById('categoria').value;
            document.getElementById('wrapper-alumno-extra').classList.toggle('hidden', v !== 'ingreso-clase');
            document.getElementById('wrapper-taller-extra').classList.toggle('hidden', v !== 'ingreso-taller');
        };

        window.verHistorial = (id) => {
            const a = alumnos.find(x => x.id === id);
            if(!a) return;
            document.getElementById('modal-titulo-alumno').innerText = a.nombre;
            const pagos = transacciones.filter(t => t.alumnoRel === a.nombre);
            let total = 0;
            document.getElementById('modal-lista-pagos').innerHTML = pagos.map(p => {
                total += p.monto;
                return `<div class="bg-white p-4 rounded-xl border border-slate-200 flex justify-between items-center">
                            <div><p class="text-[10px] font-black uppercase text-slate-700">${p.descripcion.replace('[PAGO] ', '')}</p>
                            <p class="text-[8px] font-bold text-slate-400 uppercase">${p.fecha}</p></div>
                            <p class="font-black text-indigo-600">$${p.monto.toLocaleString()}</p></div>`;
            }).join('') || '<p class="text-center text-slate-400 text-xs py-10">Sin pagos registrados</p>';
            document.getElementById('modal-total-alumno').innerText = `$${total.toLocaleString()}`;
            document.getElementById('modal-historial').classList.remove('hidden');
        };

        window.cerrarModal = () => document.getElementById('modal-historial').classList.add('hidden');

        document.getElementById('finance-form').onsubmit = async (e) => {
            e.preventDefault();
            const cat = document.getElementById('categoria').value;
            const monto = parseFloat(document.getElementById('monto').value);
            const fecha = document.getElementById('fecha').value;
            const nota = document.getElementById('descripcion').value;
            let data = { fecha, categoria: cat, tipo: cat.startsWith('ingreso') ? 'ingreso' : 'egreso', monto, timestamp: Date.now() };

            if(cat === 'ingreso-clase') {
                const al = document.getElementById('select-alumno').value;
                const cu = document.getElementById('select-curso').value;
                const ses = document.getElementById('sesion-numero').value;
                const mes = document.getElementById('mes-pagado').value;
                data.alumnoRel = al;
                data.descripcion = `[PAGO] ${al} | ${cu} (Sesión: ${ses} - ${mes})`;
            } else if(cat === 'ingreso-taller') {
                const alT = document.getElementById('taller-alumno-nombre').value;
                const tal = document.getElementById('select-taller').value;
                data.descripcion = `[TALLER] ${alT} | ${tal}`;
            } else {
                data.descripcion = nota || cat;
            }

            await addDoc(transColl, data);
            document.getElementById('monto').value = '';
            document.getElementById('descripcion').value = '';
        };

        document.getElementById('alumno-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(alumColl, {
                nombre: document.getElementById('nombre-alumno').value,
                curp: document.getElementById('curp-alumno').value,
                tel: document.getElementById('tel-alumno').value
            });
            document.getElementById('alumno-form').reset();
        };

        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fecha').value = hoy;
        document.getElementById('filtro-fecha').value = hoy;
        document.getElementById('filtro-fecha').onchange = renderFinanzas;
        checkCategoryFields();
    </script>
</body>
</html>
