<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sully Bec Instituto - Gestión Integral</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary-color: #6366f1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { color: var(--primary-color); font-weight: 800; border-bottom: 3px solid var(--primary-color); }
        .balance-card { background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%); }
        .sticky-header { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #f43f5e; }
        input:checked + .slider:before { transform: translateX(20px); }
        input, select { outline: none !important; }
        nav::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <div class="sticky-header px-4 py-3">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black">SB</div>
                <div>
                    <h1 class="text-lg font-extrabold text-indigo-950 tracking-tight leading-none">Sully Bec</h1>
                    <p class="text-[8px] font-bold text-rose-400 uppercase tracking-widest mt-0.5">Instituto</p>
                </div>
            </div>
            <div id="status-badge" class="flex items-center gap-1.5 bg-slate-100 px-3 py-1 rounded-full">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <p id="status-text" class="text-[9px] font-black text-slate-500 uppercase">Sistema Activo</p>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 pt-4 pb-24">
        <!-- Dashboard Saldos -->
        <div class="balance-card p-6 rounded-[2rem] text-white mb-6 shadow-xl text-center">
            <p class="text-[10px] font-bold opacity-70 uppercase tracking-widest">Saldo en Caja (Real)</p>
            <h2 id="total-balance" class="text-5xl font-black mt-1">$0</h2>
            <div class="flex justify-center gap-8 mt-6">
                <div><p class="text-[9px] font-bold uppercase opacity-60">Ingresos</p><p id="total-ingresos" class="text-sm font-black text-emerald-300">$0</p></div>
                <div><p class="text-[9px] font-bold uppercase opacity-60">Egresos</p><p id="total-egresos" class="text-sm font-black text-rose-300">$0</p></div>
            </div>
        </div>

        <nav class="flex mb-6 bg-white p-1 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
            <button onclick="switchTab('finanzas')" id="btn-finanzas" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase tab-active whitespace-nowrap">Cobros Rápidos</button>
            <button onclick="switchTab('gestion')" id="btn-gestion" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase text-slate-400 whitespace-nowrap">Alumnos</button>
            <button onclick="switchTab('cursos')" id="btn-cursos" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase text-slate-400 whitespace-nowrap">Cursos</button>
        </nav>

        <!-- Sección Finanzas -->
        <section id="sec-finanzas" class="space-y-6">
            <div class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <form id="finance-form" class="space-y-4">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nuevo Movimiento</h3>
                        <div class="flex items-center gap-2">
                            <span class="text-[8px] font-black text-rose-600 uppercase">Historial</span>
                            <label class="switch"><input type="checkbox" id="solo-historial"><span class="slider"></span></label>
                        </div>
                    </div>
                    <select id="categoria" onchange="toggleFields()" class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm text-indigo-950">
                        <optgroup label="Cobros">
                            <option value="ingreso-clase">Pago de Clase</option>
                            <option value="ingreso-taller">Taller</option>
                            <option value="ingreso-renta">Renta</option>
                        </optgroup>
                        <optgroup label="Gastos">
                            <option value="egreso-luz">Servicios</option>
                            <option value="egreso-profesores">Profesores</option>
                        </optgroup>
                    </select>
                    <div id="fields-alumno" class="space-y-3">
                        <select id="select-alumno" class="w-full bg-indigo-50 border-none rounded-xl p-3 text-sm font-bold text-indigo-900">
                            <option value="">Selecciona Alumno...</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="date" id="fecha-pago-real" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        <input type="number" id="monto" placeholder="Monto $" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                    </div>
                    <input type="text" id="descripcion" placeholder="Descripción corta..." class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">
                    <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase text-xs">Registrar</button>
                </form>
            </div>
            <div id="lista-transacciones" class="space-y-2"></div>
        </section>

        <!-- Sección Cursos -->
        <section id="sec-cursos" class="hidden space-y-6">
            <div class="bg-white border-2 border-slate-900 rounded-[2rem] p-6 shadow-sm">
                <h3 class="text-[10px] font-black text-slate-400 uppercase mb-4">Mantenimiento de Datos</h3>
                <div class="grid grid-cols-1 gap-3">
                    <button onclick="exportarExcel()" class="bg-emerald-600 text-white py-4 rounded-xl font-black text-xs uppercase shadow-sm">
                        📥 Descargar Respaldo Completo
                    </button>
                    <label class="bg-amber-500 text-white py-4 rounded-xl font-black text-xs uppercase shadow-sm text-center cursor-pointer">
                        📤 Subir Respaldo (Restaurar)
                        <input type="file" id="import-excel" class="hidden" accept=".xlsx, .xls" onchange="importarExcel(event)">
                    </label>
                </div>
            </div>
            <div id="ui-cursos" class="space-y-3"></div>
        </section>

        <!-- Sección Alumnos -->
        <section id="sec-gestion" class="hidden space-y-4">
             <div class="bg-white border border-indigo-100 rounded-[2rem] p-6 shadow-sm">
                <form id="alumno-form" class="space-y-3">
                    <input type="text" id="nombre-alumno" placeholder="Nombre Alumno" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase">Registrar Alumno</button>
                </form>
            </div>
            <div id="ui-alumnos" class="grid grid-cols-1 gap-3"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcAda5-ewiR78bfLyYrjEMhfdc0RFxd7s",
            authDomain: "finanzas-escuela.firebaseapp.com",
            projectId: "finanzas-escuela",
            storageBucket: "finanzas-escuela.firebasestorage.app",
            messagingSenderId: "106864276061",
            appId: "1:106864276061:web:cc8b26cca0ef07088f13b4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let transacciones = [], alumnos = [], cursos = [];

        // --- MANEJO DE ERRORES DE PERMISOS ---
        const handleError = (error) => {
            console.error(error);
            if(error.code === 'permission-denied') {
                const badge = document.getElementById('status-badge');
                badge.classList.remove('bg-slate-100');
                badge.classList.add('bg-rose-100', 'border', 'border-rose-300');
                document.getElementById('status-text').innerText = "ERROR DE PERMISOS";
                document.getElementById('status-text').classList.add('text-rose-600');
            }
        };

        // --- LISTENERS ---
        onSnapshot(query(collection(db, "transacciones"), orderBy("timestamp", "desc")), 
            (snap) => { transacciones = snap.docs.map(d => ({id: d.id, ...d.data()})); renderFinanzas(); }, 
            handleError);

        onSnapshot(query(collection(db, "alumnos"), orderBy("nombre", "asc")), 
            (snap) => { alumnos = snap.docs.map(d => ({id: d.id, ...d.data()})); renderAlumnos(); populateSelects(); }, 
            handleError);

        // --- EXCEL LOGIC ---
        window.exportarExcel = () => {
            const wb = XLSX.utils.book_new();
            const wsTrans = XLSX.utils.json_to_sheet(transacciones.map(({id, timestamp, ...r}) => r));
            const wsAlum = XLSX.utils.json_to_sheet(alumnos.map(({id, ...r}) => r));
            XLSX.utils.book_append_sheet(wb, wsTrans, "Transacciones");
            XLSX.utils.book_append_sheet(wb, wsAlum, "Alumnos");
            XLSX.writeFile(wb, `Respaldo_SullyBec_${new Date().toISOString().split('T')[0]}.xlsx`);
        };

        window.importarExcel = (event) => {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    for (const sheetName of workbook.SheetNames) {
                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                        const col = sheetName.toLowerCase() === 'alumnos' ? 'alumnos' : 'transacciones';
                        
                        console.log(`Subiendo ${jsonData.length} registros a ${col}...`);
                        for (const item of jsonData) {
                            if(col === 'transacciones') item.timestamp = serverTimestamp();
                            await addDoc(collection(db, col), item);
                        }
                    }
                    alert("¡Restauración exitosa!");
                } catch (err) {
                    alert("Error al importar: Revisa los permisos de Firebase.");
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        // --- RENDER FUNCTIONS ---
        function renderFinanzas() {
            const ui = document.getElementById('lista-transacciones');
            ui.innerHTML = '';
            let i=0, e=0;
            transacciones.forEach(t => {
                const esIngreso = t.categoria.startsWith('ingreso');
                if(!t.soloHistorial) { esIngreso ? i += Number(t.monto) : e += Number(t.monto); }
                ui.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm">
                        <div><p class="text-[10px] font-black uppercase">${t.descripcion || t.categoria}</p><p class="text-[8px] text-slate-400 font-bold">${t.fechaPago}</p></div>
                        <div class="text-right ml-4">
                            <p class="font-black text-sm ${esIngreso ? 'text-emerald-500' : 'text-rose-500'}">$${t.monto}</p>
                            <button onclick="window.eliminarDoc('transacciones', '${t.id}')" class="text-[8px] font-bold text-slate-300 uppercase">Borrar</button>
                        </div>
                    </div>`;
            });
            document.getElementById('total-ingresos').innerText = `$${i.toLocaleString()}`;
            document.getElementById('total-egresos').innerText = `$${e.toLocaleString()}`;
            document.getElementById('total-balance').innerText = `$${(i-e).toLocaleString()}`;
        }

        window.renderAlumnos = () => {
            document.getElementById('ui-alumnos').innerHTML = alumnos.map(a => `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center border border-slate-100 shadow-sm">
                    <p class="font-black text-xs uppercase">${a.nombre}</p>
                    <button onclick="window.eliminarDoc('alumnos', '${a.id}')" class="text-rose-400 text-[8px] font-bold uppercase">Borrar</button>
                </div>`).join('');
        };

        function populateSelects() {
            const s = document.getElementById('select-alumno');
            s.innerHTML = '<option value="">Selecciona Alumno...</option>' + alumnos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
        }

        window.switchTab = (t) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`sec-${t}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`btn-${t}`).classList.add('tab-active');
        };

        window.eliminarDoc = async (c, id) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, c, id)); };

        document.getElementById('finance-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "transacciones"), {
                categoria: document.getElementById('categoria').value,
                alumno: document.getElementById('select-alumno').value,
                monto: Number(document.getElementById('monto').value),
                fechaPago: document.getElementById('fecha-pago-real').value,
                descripcion: document.getElementById('descripcion').value,
                soloHistorial: document.getElementById('solo-historial').checked,
                timestamp: serverTimestamp()
            });
            e.target.reset();
        };

        document.getElementById('alumno-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "alumnos"), { nombre: document.getElementById('nombre-alumno').value });
            e.target.reset();
        };

    </script>
</body>
</html>
