<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SullyBec Instituto - Gestión Integral</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { --primary-color: #6366f1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { color: var(--primary-color); font-weight: 800; border-bottom: 3px solid var(--primary-color); }
        .balance-card { background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%); }
        .sticky-header { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        .input-focus { transition: all 0.2s; border: 2px solid transparent; }
        .input-focus:focus { border-color: #6366f1; background: white; outline: none; }
        
        /* Switch styling */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #f43f5e; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <!-- Header -->
    <div class="sticky-header px-4 py-3 border-b border-slate-200">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="bg-white border border-slate-100 p-1 rounded-lg shadow-sm" style="width: 40px; height: 40px;">
                    <img src="https://lh3.googleusercontent.com/d/1gjM8QJhfynpT0il86P3IRWwD_wMQWcCC" alt="SullyBec Logo" class="h-full w-auto mx-auto">
                </div>
                <h1 class="text-lg font-extrabold text-indigo-950">SullyBec</h1>
            </div>
            <div id="status-cloud" class="flex items-center gap-1.5 bg-slate-100 px-3 py-1 rounded-full">
                <span class="w-2 h-2 rounded-full bg-emerald-500" id="status-dot"></span>
                <p id="status-text" class="text-[9px] font-black text-slate-500 uppercase tracking-tighter">Sincronizado</p>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 pt-4 pb-24">
        <!-- Saldo -->
        <div class="balance-card p-6 rounded-[2rem] text-white mb-6 shadow-xl">
            <p class="text-[10px] font-bold opacity-70 uppercase tracking-widest text-center">Saldo Disponible en Caja</p>
            <h2 id="total-balance" class="text-5xl font-black mt-1 text-center">$0</h2>
            <div class="flex justify-center gap-8 mt-6">
                <div class="text-center">
                    <p class="text-[9px] font-bold uppercase opacity-60">Ingresos Reales</p>
                    <p id="total-ingresos" class="text-sm font-black text-emerald-300">$0</p>
                </div>
                <div class="text-center">
                    <p class="text-[9px] font-bold uppercase opacity-60">Gastos Reales</p>
                    <p id="total-egresos" class="text-sm font-black text-rose-300">$0</p>
                </div>
            </div>
        </div>

        <!-- Navegación -->
        <nav class="flex mb-6 bg-white p-1 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
            <button onclick="switchTab('finanzas')" id="btn-finanzas" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase tab-active whitespace-nowrap">Cobros Rápidos</button>
            <button onclick="switchTab('gestion')" id="btn-gestion" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase text-slate-400 whitespace-nowrap">Alumnos</button>
            <button onclick="switchTab('cursos')" id="btn-cursos" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase text-slate-400 whitespace-nowrap">Cursos</button>
        </nav>

        <!-- SECCIÓN FINANZAS -->
        <section id="sec-finanzas" class="space-y-6">
            <div class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nuevo Movimiento</h3>
                    <div class="flex items-center gap-2 bg-rose-50 px-3 py-1.5 rounded-xl border border-rose-100">
                        <span class="text-[8px] font-black text-rose-600 uppercase">¿Carga de historial?</span>
                        <label class="switch">
                            <input type="checkbox" id="solo-historial">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <form id="finance-form" class="space-y-4">
                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Concepto</label>
                        <select id="categoria" onchange="toggleFields()" class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm text-indigo-950">
                            <optgroup label="Cobros">
                                <option value="ingreso-clase">Pago de Clase (Diplomado)</option>
                                <option value="ingreso-renta">Renta de Consultorio</option>
                                <option value="ingreso-otro">Otro Ingreso</option>
                            </optgroup>
                            <optgroup label="Pagos / Gastos">
                                <option value="egreso-renta">Pago de Renta Local</option>
                                <option value="egreso-luz">Servicio de Luz</option>
                                <option value="egreso-internet">Servicio de Internet</option>
                                <option value="egreso-otros">Otros Gastos</option>
                            </optgroup>
                        </select>
                    </div>

                    <div id="fields-alumno" class="bg-indigo-50/50 p-4 rounded-2xl space-y-3 border border-indigo-100">
                        <div>
                            <label class="block text-[9px] font-bold text-indigo-400 mb-1 uppercase">Seleccionar Alumno</label>
                            <select id="select-alumno" onchange="autoSugerirSesionYFecha()" class="w-full bg-white border-none rounded-lg p-3 text-sm font-bold shadow-sm text-indigo-900"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[9px] font-bold text-indigo-400 mb-1 uppercase">Sesión N°</label>
                                <input type="number" id="num-sesion" class="w-full bg-white border-none rounded-lg p-3 text-xs font-bold shadow-sm text-indigo-950">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-indigo-400 mb-1 uppercase">Fecha de Clase</label>
                                <input type="date" id="fecha-clase-corresponde" class="w-full bg-white border-none rounded-lg p-3 text-xs font-bold shadow-sm">
                            </div>
                        </div>
                        <p id="info-calendario" class="text-[8px] font-bold text-indigo-500 uppercase italic"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Fecha Pago</label>
                            <input type="date" id="fecha-pago-real" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Monto ($)</label>
                            <input type="number" id="monto" placeholder="0.00" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        </div>
                    </div>

                    <input type="text" id="descripcion" placeholder="Notas (opcional)..." class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">
                    <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase text-xs hover:bg-indigo-700 transition-colors">Confirmar Registro</button>
                </form>
            </div>
            
            <div id="lista-transacciones" class="space-y-2"></div>
        </section>

        <!-- SECCIÓN GESTIÓN ALUMNOS -->
        <section id="sec-gestion" class="hidden space-y-6">
            <div id="form-alumno-container" class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <h3 id="form-alumno-title" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Registrar Alumno</h3>
                <form id="alumno-form" class="space-y-3">
                    <input type="hidden" id="edit-id-alumno">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Nombre Completo</label>
                            <input type="text" id="nombre-alumno" placeholder="Nombre" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold input-focus">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Diplomado / Curso</label>
                            <select id="select-curso-alumno" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold input-focus"></select>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">CURP</label>
                            <input type="text" id="curp-alumno" placeholder="CURP" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold input-focus">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Teléfono</label>
                            <input type="tel" id="tel-alumno" placeholder="Teléfono" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold input-focus">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Fecha Primer Clase</label>
                        <input type="date" id="fecha-inicio-alumno" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold input-focus">
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-alumno" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold text-xs uppercase shadow-md">Guardar Alumno</button>
                        <button type="button" id="btn-cancelar-edit" onclick="cancelarEdicion()" class="hidden bg-slate-200 text-slate-500 py-3 px-6 rounded-xl font-bold text-xs uppercase">Cancelar</button>
                    </div>
                </form>
            </div>
            <div id="ui-alumnos" class="space-y-3"></div>
        </section>

        <!-- SECCIÓN GESTIÓN CURSOS -->
        <section id="sec-cursos" class="hidden space-y-6">
            <div id="form-curso-container" class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <h3 id="form-curso-title" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Configuración de Cursos</h3>
                <form id="curso-form" class="space-y-3">
                    <input type="hidden" id="edit-id-curso">
                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Nombre del Diplomado</label>
                        <input type="text" id="nombre-curso" placeholder="Ej: Diplomado en Masajes" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold input-focus">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Semanas Totales</label>
                            <input type="number" id="duracion-curso" placeholder="Ej: 12" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold input-focus">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Costo por Clase ($)</label>
                            <input type="number" id="costo-clase" placeholder="0.00" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold input-focus">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Fecha Inicio</label>
                            <input type="date" id="fecha-inicio-curso" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold input-focus">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Fecha Término</label>
                            <input type="date" id="fecha-fin-curso" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold input-focus">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-rose-400 mb-1 uppercase">Fechas Suspendidas (Separadas por comas)</label>
                        <input type="text" id="festivos-curso" placeholder="2024-12-25, 2025-01-01" class="w-full bg-rose-50 border-none rounded-xl p-3 text-sm font-bold text-rose-900 placeholder:text-rose-200">
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-curso" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold text-xs uppercase shadow-md mt-2">Guardar Curso</button>
                        <button type="button" id="btn-cancelar-curso" onclick="cancelarEdicionCurso()" class="hidden bg-slate-200 text-slate-500 py-3 px-6 rounded-xl font-bold text-xs uppercase mt-2">Cancelar</button>
                    </div>
                </form>
            </div>
            <div id="ui-cursos" class="space-y-3"></div>
        </section>
    </div>

    <!-- Modal Historial -->
    <div id="modal-historial" class="fixed inset-0 bg-white z-[100] hidden flex flex-col">
        <div class="p-6 bg-indigo-800 text-white shadow-xl">
            <div class="flex justify-between items-center">
                <div>
                    <h2 id="modal-nombre" class="text-xl font-black">Historial</h2>
                    <p id="modal-curso-sub" class="text-[10px] font-bold opacity-70 uppercase"></p>
                </div>
                <button onclick="cerrarModal()" class="text-xs font-bold bg-white/20 px-4 py-2 rounded-xl">Cerrar</button>
            </div>
            <div id="modal-stats" class="mt-4 flex gap-4 bg-black/10 p-3 rounded-xl"></div>
        </div>
        <div id="modal-content" class="flex-1 overflow-y-auto p-4 space-y-2 bg-slate-50"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcAda5-ewiR78bfLyYrjEMhfdc0RFxd7s",
            authDomain: "finanzas-escuela.firebaseapp.com",
            projectId: "finanzas-escuela",
            storageBucket: "finanzas-escuela.firebasestorage.app",
            messagingSenderId: "106864276061",
            appId: "1:106864276061:web:cc8b26cca0ef07088f13b4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const transColl = collection(db, "transacciones");
        const alumColl = collection(db, "alumnos");
        const cursoColl = collection(db, "cursos");

        let transacciones = [], alumnos = [], cursos = [];
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        // Escuchar Transacciones
        onSnapshot(query(transColl, orderBy("timestamp", "desc")), (snap) => {
            transacciones = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderFinanzas();
            renderAlumnos();
            statusDot.className = "w-2 h-2 rounded-full bg-emerald-500";
            statusText.innerText = "Sincronizado";
        });

        // Escuchar Alumnos
        onSnapshot(query(alumColl, orderBy("nombre", "asc")), (snap) => {
            alumnos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderAlumnos();
            populateAlumnosSelect();
        });

        // Escuchar Cursos
        onSnapshot(query(cursoColl, orderBy("nombre", "asc")), (snap) => {
            cursos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderCursos();
            populateCursosSelect();
        });

        function renderFinanzas() {
            const ui = document.getElementById('lista-transacciones');
            ui.innerHTML = '';
            let i=0, e=0;
            
            // Solo sumamos transacciones que NO sean de historial
            transacciones.forEach(t => {
                if(!t.soloHistorial) {
                    const m = parseFloat(t.monto);
                    t.tipo === 'ingreso' ? i += m : e += m;
                }
                
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center";
                card.innerHTML = `
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <p class="text-[11px] font-black text-slate-800 uppercase leading-none">${t.descripcion}</p>
                            ${t.soloHistorial ? '<span class="text-[7px] font-bold bg-rose-50 text-rose-500 px-1.5 rounded border border-rose-100 uppercase">Historial</span>' : ''}
                        </div>
                        <p class="text-[8px] font-bold text-slate-400 uppercase mt-1">
                            ${t.numSesion ? 'SESIÓN ' + t.numSesion + ' • ' : ''} FECHA: ${t.fechaClase || t.fechaPago}
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-sm ${t.tipo === 'ingreso' ? 'text-emerald-500' : 'text-rose-500'} ${t.soloHistorial ? 'opacity-30' : ''}">$${parseFloat(t.monto).toLocaleString()}</p>
                        <button onclick="eliminarDoc('transacciones', '${t.id}')" class="text-[8px] font-bold text-slate-300 uppercase">Borrar</button>
                    </div>
                `;
                ui.appendChild(card);
            });
            document.getElementById('total-ingresos').innerText = `$${i.toLocaleString()}`;
            document.getElementById('total-egresos').innerText = `$${e.toLocaleString()}`;
            document.getElementById('total-balance').innerText = `$${(i-e).toLocaleString()}`;
        }

        // --- LÓGICA DE CALENDARIO INTELIGENTE ---
        function obtenerProximaFechaValida(fechaInicioStr, numSesionSolicitada, festivosStr) {
            const festivos = festivosStr ? festivosStr.split(',').map(f => f.trim()) : [];
            let fechaActual = new Date(fechaInicioStr + "T00:00:00");
            let sesionesContadas = 1;

            while (sesionesContadas < numSesionSolicitada) {
                fechaActual.setDate(fechaActual.getDate() + 7);
                const actualStr = fechaActual.toISOString().split('T')[0];
                if (festivos.includes(actualStr)) continue; 
                sesionesContadas++;
            }
            return fechaActual.toISOString().split('T')[0];
        }

        window.autoSugerirSesionYFecha = () => {
            const nombreAlum = document.getElementById('select-alumno').value;
            const alum = alumnos.find(a => a.nombre === nombreAlum);
            if (!alum) return;

            const curso = cursos.find(c => c.nombre === alum.curso);
            // Buscamos cuál fue el número de sesión más alto registrado para este alumno
            const registrosAnteriores = transacciones.filter(t => t.alumno === nombreAlum && t.categoria === 'ingreso-clase');
            let ultimaSesion = 0;
            if(registrosAnteriores.length > 0) {
                ultimaSesion = Math.max(...registrosAnteriores.map(r => parseInt(r.numSesion || 0)));
            }
            
            const proximaSesion = ultimaSesion + 1;
            document.getElementById('num-sesion').value = proximaSesion;
            
            if (curso && alum.fechaInicio) {
                const fechaSugerida = obtenerProximaFechaValida(alum.fechaInicio, proximaSesion, curso.festivos);
                document.getElementById('fecha-clase-corresponde').value = fechaSugerida;
                document.getElementById('monto').value = curso.costo;
                document.getElementById('info-calendario').innerText = `Proxima: Sesión ${proximaSesion} (${fechaSugerida})`;
            }
        };

        function calcularEstado(alumno) {
            const curso = cursos.find(c => c.nombre === alumno.curso);
            if (!curso) return { esperadas: 0, pagadas: 0, deuda: 0 };

            const hoy = new Date();
            const inicio = new Date(alumno.fechaInicio + "T00:00:00");
            const festivos = curso.festivos ? curso.festivos.split(',').map(f => f.trim()) : [];
            
            let sesionesEsperadas = 0;
            let iterador = new Date(inicio);

            while (iterador <= hoy) {
                const iterStr = iterador.toISOString().split('T')[0];
                if (!festivos.includes(iterStr)) {
                    sesionesEsperadas++;
                }
                iterador.setDate(iterador.getDate() + 7);
                if (sesionesEsperadas >= parseInt(curso.duracion)) break;
            }

            const pagadas = transacciones.filter(t => t.alumno === alumno.nombre && t.categoria === 'ingreso-clase').length;
            const deuda = sesionesEsperadas - pagadas;
            return { esperadas: sesionesEsperadas, pagadas: pagadas, deuda: deuda };
        }

        function renderAlumnos() {
            const ui = document.getElementById('ui-alumnos');
            ui.innerHTML = alumnos.map(a => {
                const estado = calcularEstado(a);
                const debe = estado.deuda > 0;
                return `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-start">
                        <div onclick="verHistorial('${a.nombre}')" class="cursor-pointer flex-1">
                            <p class="font-black text-sm text-indigo-950 uppercase leading-tight">${a.nombre}</p>
                            <span class="inline-block bg-indigo-50 text-indigo-600 text-[8px] font-black px-2 py-0.5 rounded uppercase mt-1">${a.curso || 'Sin Curso'}</span>
                            <div class="mt-3 grid grid-cols-2 gap-x-4 gap-y-1">
                                <p class="text-[8px] font-bold text-slate-400 uppercase tracking-tighter">TEL: <span class="text-slate-600">${a.telefono || '---'}</span></p>
                                <p class="text-[8px] font-bold text-slate-400 uppercase tracking-tighter">INICIO: <span class="text-slate-600">${a.fechaInicio}</span></p>
                            </div>
                        </div>
                        <div class="text-right flex flex-col gap-2">
                            <span class="inline-block px-2 py-1 rounded-lg text-[9px] font-black uppercase ${debe ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'}">
                                ${debe ? 'Debe ' + estado.deuda : 'Al día'}
                            </span>
                            <button onclick="prepararEdicion('${a.id}')" class="text-[9px] font-black text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-100">Editar</button>
                        </div>
                    </div>
                </div>
            `;}).join('') || '<p class="text-center py-10 text-slate-400 font-bold uppercase text-xs">No hay alumnos</p>';
        }

        function renderCursos() {
            const ui = document.getElementById('ui-cursos');
            ui.innerHTML = cursos.map(c => `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-start">
                        <div onclick="prepararEdicionCurso('${c.id}')" class="cursor-pointer flex-1">
                            <p class="font-black text-sm text-indigo-950 uppercase leading-tight">${c.nombre}</p>
                            <p class="text-[9px] font-bold text-indigo-400 uppercase mt-1">${c.duracion} Sesiones • $${c.costo}</p>
                        </div>
                        <div class="flex gap-2">
                             <button onclick="prepararEdicionCurso('${c.id}')" class="text-[9px] font-black text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-100">Editar</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function populateAlumnosSelect() {
            const sel = document.getElementById('select-alumno');
            sel.innerHTML = `<option value="">Selecciona Alumno...</option>` + alumnos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
        }

        function populateCursosSelect() {
            const sel = document.getElementById('select-curso-alumno');
            sel.innerHTML = `<option value="">Seleccionar Curso...</option>` + cursos.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
        }

        window.switchTab = (t) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`sec-${t}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`btn-${t}`).classList.add('tab-active');
        };

        window.toggleFields = () => {
            document.getElementById('fields-alumno').classList.toggle('hidden', document.getElementById('categoria').value !== 'ingreso-clase');
        };

        // Guardar Movimiento con opción de historial
        document.getElementById('finance-form').onsubmit = async (e) => {
            e.preventDefault();
            const cat = document.getElementById('categoria').value;
            const monto = parseFloat(document.getElementById('monto').value);
            const soloHistorial = document.getElementById('solo-historial').checked;
            
            const data = {
                tipo: cat.startsWith('ingreso') ? 'ingreso' : 'egreso',
                categoria: cat, 
                monto,
                fechaPago: document.getElementById('fecha-pago-real').value,
                timestamp: Date.now(),
                soloHistorial: soloHistorial
            };

            if(cat === 'ingreso-clase') {
                const alum = document.getElementById('select-alumno').value;
                const nS = document.getElementById('num-sesion').value;
                if(!alum) return;
                data.alumno = alum;
                data.fechaClase = document.getElementById('fecha-clase-corresponde').value;
                data.numSesion = nS;
                data.descripcion = `Clase ${nS}: ${alum}`;
            } else { 
                data.descripcion = document.getElementById('descripcion').value || cat.toUpperCase(); 
            }

            await addDoc(transColl, data);
            
            // Si es historial, avisamos sutilmente
            if(soloHistorial) {
                console.log("Cargado al historial (sin sumar dinero)");
            }

            document.getElementById('finance-form').reset();
            resetFechas();
            toggleFields();
        };

        // Registro Alumno
        document.getElementById('alumno-form').onsubmit = async (e) => {
            e.preventDefault();
            const idEdit = document.getElementById('edit-id-alumno').value;
            const data = {
                nombre: document.getElementById('nombre-alumno').value,
                curso: document.getElementById('select-curso-alumno').value,
                curp: document.getElementById('curp-alumno').value,
                telefono: document.getElementById('tel-alumno').value,
                fechaInicio: document.getElementById('fecha-inicio-alumno').value
            };
            if(idEdit) await updateDoc(doc(db, "alumnos", idEdit), data);
            else await addDoc(alumColl, data);
            cancelarEdicion();
        };

        // Registro Curso
        document.getElementById('curso-form').onsubmit = async (e) => {
            e.preventDefault();
            const idEdit = document.getElementById('edit-id-curso').value;
            const data = {
                nombre: document.getElementById('nombre-curso').value,
                duracion: document.getElementById('duracion-curso').value,
                costo: document.getElementById('costo-clase').value,
                fechaInicio: document.getElementById('fecha-inicio-curso').value,
                fechaFin: document.getElementById('fecha-fin-curso').value,
                festivos: document.getElementById('festivos-curso').value
            };
            if(idEdit) await updateDoc(doc(db, "cursos", idEdit), data);
            else await addDoc(cursoColl, data);
            cancelarEdicionCurso();
        };

        window.prepararEdicion = (id) => {
            const a = alumnos.find(al => al.id === id);
            document.getElementById('edit-id-alumno').value = a.id;
            document.getElementById('nombre-alumno').value = a.nombre;
            document.getElementById('select-curso-alumno').value = a.curso;
            document.getElementById('curp-alumno').value = a.curp || '';
            document.getElementById('tel-alumno').value = a.telefono || '';
            document.getElementById('fecha-inicio-alumno').value = a.fechaInicio;
            document.getElementById('btn-cancelar-edit').classList.remove('hidden');
        };

        window.prepararEdicionCurso = (id) => {
            const c = cursos.find(cu => cu.id === id);
            document.getElementById('edit-id-curso').value = c.id;
            document.getElementById('nombre-curso').value = c.nombre;
            document.getElementById('duracion-curso').value = c.duracion;
            document.getElementById('costo-clase').value = c.costo;
            document.getElementById('fecha-inicio-curso').value = c.fechaInicio;
            document.getElementById('fecha-fin-curso').value = c.fechaFin;
            document.getElementById('festivos-curso').value = c.festivos || '';
            document.getElementById('btn-cancelar-curso').classList.remove('hidden');
        };

        window.cancelarEdicion = () => {
            document.getElementById('alumno-form').reset();
            document.getElementById('edit-id-alumno').value = "";
            document.getElementById('btn-cancelar-edit').classList.add('hidden');
        };

        window.cancelarEdicionCurso = () => {
            document.getElementById('curso-form').reset();
            document.getElementById('edit-id-curso').value = "";
            document.getElementById('btn-cancelar-curso').classList.add('hidden');
        };

        window.verHistorial = (nombre) => {
            const alumno = alumnos.find(a => a.nombre === nombre);
            const pagos = transacciones.filter(t => t.alumno === nombre).sort((a,b) => (a.numSesion || 0) - (b.numSesion || 0));
            document.getElementById('modal-nombre').innerText = nombre;
            document.getElementById('modal-content').innerHTML = pagos.map(p => `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center shadow-sm">
                    <div><p class="text-[10px] font-black text-indigo-600 uppercase">SESIÓN ${p.numSesion || '?'}</p><p class="text-[8px] font-bold text-slate-400">Clase: ${p.fechaClase || p.fechaPago}</p></div>
                    <div class="text-right">
                        <p class="font-black text-slate-800">$${parseFloat(p.monto).toLocaleString()}</p>
                        ${p.soloHistorial ? '<p class="text-[7px] text-rose-400 font-bold uppercase">Solo Historial</p>' : ''}
                    </div>
                </div>
            `).join('') || '<p class="text-center py-20 text-slate-400 font-bold uppercase text-xs">Sin pagos</p>';
            document.getElementById('modal-historial').classList.remove('hidden');
        };

        window.cerrarModal = () => document.getElementById('modal-historial').classList.add('hidden');
        window.eliminarDoc = async (c, id) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, c, id)); };

        const resetFechas = () => {
            const hoy = new Date().toISOString().split('T')[0];
            document.querySelectorAll('input[type="date"]').forEach(i => { if(!i.value) i.value = hoy; });
            document.getElementById('fecha-pago-real').value = hoy;
        };
        resetFechas();
    </script>
</body>
</html>
