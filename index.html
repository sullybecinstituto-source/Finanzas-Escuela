<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sully Bec - Gestión de Deudas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary-color: #6366f1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { color: var(--primary-color); font-weight: 800; border-bottom: 3px solid var(--primary-color); }
        .balance-card { background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%); }
        .sticky-header { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #f43f5e; }
        input:checked + .slider:before { transform: translateX(20px); }
        .danger-zone { background-color: #fff1f2; border: 2px dashed #f43f5e; border-radius: 1.5rem; padding: 1.5rem; margin-top: 2rem; }
        #custom-confirm { backdrop-filter: blur(4px); background: rgba(15, 23, 42, 0.7); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <div class="sticky-header px-4 py-3">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black">SB</div>
                <div>
                    <h1 class="text-lg font-extrabold text-indigo-950 leading-none">Sully Bec</h1>
                    <p class="text-[8px] font-bold text-rose-400 uppercase tracking-widest mt-0.5">Instituto</p>
                </div>
            </div>
            <div id="status-badge" class="flex items-center gap-1.5 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <p class="text-[9px] font-black text-emerald-600 uppercase">En Línea</p>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 pt-4 pb-24">
        <div class="balance-card p-6 rounded-[2rem] text-white mb-6 shadow-xl text-center">
            <p class="text-[10px] font-bold opacity-70 uppercase tracking-widest">Saldo en Caja (Real)</p>
            <h2 id="total-balance" class="text-5xl font-black mt-1">$0</h2>
            <div class="flex justify-center gap-8 mt-6">
                <div><p class="text-[9px] font-bold uppercase opacity-60">Ingresos</p><p id="total-ingresos" class="text-sm font-black text-emerald-300">$0</p></div>
                <div><p class="text-[9px] font-bold uppercase opacity-60">Egresos</p><p id="total-egresos" class="text-sm font-black text-rose-300">$0</p></div>
            </div>
        </div>

        <nav class="flex mb-6 bg-white p-1 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
            <button onclick="switchTab('finanzas')" id="btn-finanzas" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase tab-active whitespace-nowrap">Cobros</button>
            <button onclick="switchTab('gestion')" id="btn-gestion" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase text-slate-400 whitespace-nowrap">Alumnos</button>
            <button onclick="switchTab('cursos')" id="btn-cursos" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase text-slate-400 whitespace-nowrap">Cursos</button>
        </nav>

        <section id="sec-finanzas" class="space-y-6">
            <div class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <form id="finance-form" class="space-y-4">
                    <select id="categoria" onchange="toggleFields()" class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm text-indigo-950">
                        <option value="ingreso-clase">Pago de Clase (Diplomado)</option>
                        <option value="ingreso-otro">Otros Ingresos</option>
                        <option value="egreso-otros">Gasto / Egreso</option>
                    </select>

                    <div id="fields-alumno" class="bg-indigo-50/50 p-4 rounded-2xl space-y-3 border border-indigo-100">
                        <select id="select-alumno" class="w-full bg-white border-none rounded-lg p-3 text-sm font-bold shadow-sm text-indigo-900">
                            <option value="">Selecciona Alumno...</option>
                        </select>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="number" id="num-sesion" placeholder="Sesión N°" class="w-full bg-white border-none rounded-lg p-3 text-xs font-bold shadow-sm">
                            <input type="date" id="fecha-pago-real" required class="w-full bg-white border-none rounded-lg p-3 text-xs font-bold shadow-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="monto" placeholder="Monto $" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        <input type="text" id="descripcion" placeholder="Nota..." class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase text-xs">Registrar</button>
                </form>
            </div>
            <div id="lista-transacciones" class="space-y-2"></div>
            <div class="danger-zone">
                <button onclick="solicitarLimpieza('transacciones', 'PAGOS')" class="w-full bg-rose-600 text-white py-3 rounded-xl font-black text-[10px] uppercase">🔥 Vaciar Pagos</button>
            </div>
        </section>

        <section id="sec-gestion" class="hidden space-y-6">
            <div class="bg-white border-2 border-indigo-100 rounded-[2rem] p-6 shadow-sm">
                <form id="alumno-form" class="space-y-3">
                    <input type="text" id="nombre-alumno" placeholder="Nombre Alumno" required class="w-full bg-slate-50 rounded-xl p-3 text-sm font-bold">
                    <select id="select-curso-alumno" required class="w-full bg-slate-50 rounded-xl p-3 text-sm font-bold">
                        <option value="">Curso...</option>
                    </select>
                    <input type="date" id="fecha-inicio-alumno" required class="w-full bg-slate-50 rounded-xl p-3 text-sm font-bold">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase">Registrar Alumno</button>
                </form>
            </div>
            <div id="ui-alumnos" class="grid grid-cols-1 gap-3"></div>
            <div class="danger-zone">
                <button onclick="solicitarLimpieza('alumnos', 'ALUMNOS')" class="w-full bg-rose-600 text-white py-3 rounded-xl font-black text-[10px] uppercase">🗑️ Borrar Alumnos</button>
            </div>
        </section>

        <section id="sec-cursos" class="hidden space-y-6">
            <div class="bg-white border-2 border-slate-900 rounded-[2rem] p-6 shadow-sm">
                <form id="curso-form" class="space-y-3">
                    <input type="text" id="nombre-curso" placeholder="Nombre Diplomado" required class="w-full bg-slate-50 rounded-xl p-3 text-sm font-bold">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="duracion-curso" placeholder="Sesiones" required class="w-full bg-slate-50 rounded-xl p-3 text-sm font-bold">
                        <input type="number" id="costo-clase" placeholder="Costo Sesión $" required class="w-full bg-slate-50 rounded-xl p-3 text-sm font-bold">
                    </div>
                    <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black text-xs uppercase">Guardar Curso</button>
                </form>
                <div class="mt-4 flex gap-2">
                    <button onclick="exportarExcel()" class="flex-1 bg-emerald-600 text-white py-3 rounded-lg font-black text-[10px] uppercase">📥 Exportar</button>
                    <label class="flex-1 bg-amber-500 text-white py-3 rounded-lg font-black text-[10px] uppercase text-center cursor-pointer">📤 Importar<input type="file" class="hidden" onchange="importarExcel(event)"></label>
                </div>
            </div>
            <div id="ui-cursos" class="space-y-3"></div>
        </section>
    </div>

    <div id="modal-historial" class="fixed inset-0 bg-white z-[100] hidden flex flex-col">
        <div class="p-6 bg-indigo-900 text-white flex justify-between items-center">
            <div>
                <h2 id="modal-nombre" class="text-xl font-black uppercase">Historial</h2>
                <p id="modal-subtitulo" class="text-[10px] font-bold opacity-60 uppercase"></p>
            </div>
            <button onclick="cerrarModal()" class="bg-white/20 px-4 py-2 rounded-xl text-xs font-bold uppercase">Cerrar</button>
        </div>
        
        <!-- Resumen de Deuda -->
        <div id="deuda-summary" class="bg-indigo-50 p-6 flex justify-around border-b border-indigo-100">
            <div class="text-center">
                <p class="text-[9px] font-black text-slate-400 uppercase">Clases a Hoy</p>
                <p id="calc-clases-total" class="text-xl font-black text-indigo-900">0</p>
            </div>
            <div class="text-center">
                <p class="text-[9px] font-black text-slate-400 uppercase">Pagadas</p>
                <p id="calc-clases-pagadas" class="text-xl font-black text-emerald-600">0</p>
            </div>
            <div class="text-center bg-white px-4 py-2 rounded-2xl shadow-sm">
                <p class="text-[9px] font-black text-rose-400 uppercase">Pendientes</p>
                <p id="calc-clases-debe" class="text-2xl font-black text-rose-600">0</p>
            </div>
        </div>

        <div id="modal-content" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50"></div>
    </div>

    <div id="custom-confirm" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-6">
        <div class="bg-white rounded-[2rem] w-full max-w-sm p-8 shadow-2xl text-center">
            <h3 class="text-xl font-black text-slate-900 mb-2">¿Borrar todo?</h3>
            <p id="confirm-text" class="text-slate-500 text-sm mb-6">Esta acción no se puede deshacer.</p>
            <div class="flex flex-col gap-2">
                <button id="confirm-yes" class="w-full bg-rose-600 text-white py-4 rounded-2xl font-black uppercase text-xs">Sí, borrar</button>
                <button onclick="cerrarConfirmacion()" class="w-full bg-slate-100 text-slate-400 py-4 rounded-2xl font-black uppercase text-xs">Cancelar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcAda5-ewiR78bfLyYrjEMhfdc0RFxd7s",
            authDomain: "finanzas-escuela.firebaseapp.com",
            projectId: "finanzas-escuela",
            storageBucket: "finanzas-escuela.firebasestorage.app",
            messagingSenderId: "106864276061",
            appId: "1:106864276061:web:cc8b26cca0ef07088f13b4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let transacciones = [], alumnos = [], cursos = [];
        let pendieteLimpieza = null;

        // Pestañas
        window.switchTab = (t) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`sec-${t}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => {
                b.classList.remove('tab-active');
                b.classList.add('text-slate-400');
            });
            document.getElementById(`btn-${t}`).classList.add('tab-active');
            document.getElementById(`btn-${t}`).classList.remove('text-slate-400');
        };

        // Escuchadores
        onSnapshot(query(collection(db, "transacciones"), orderBy("timestamp", "desc")), (snap) => {
            transacciones = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderFinanzas();
        });

        onSnapshot(query(collection(db, "alumnos"), orderBy("nombre", "asc")), (snap) => {
            alumnos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderAlumnos();
            populateSelects();
        });

        onSnapshot(query(collection(db, "cursos"), orderBy("nombre", "asc")), (snap) => {
            cursos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderCursos();
            populateSelects();
        });

        // Lógica de Deuda e Historial
        window.abrirHistorial = (nombreAlumno) => {
            const modal = document.getElementById('modal-historial');
            const alumno = alumnos.find(a => a.nombre === nombreAlumno);
            const pagos = transacciones.filter(t => t.alumno === nombreAlumno && t.categoria === 'ingreso-clase');
            
            document.getElementById('modal-nombre').innerText = nombreAlumno;
            document.getElementById('modal-subtitulo').innerText = `Inicio: ${alumno.fechaInicio}`;

            // CALCULO DE CLASES
            const fechaInicio = new Date(alumno.fechaInicio + "T00:00:00");
            const hoy = new Date();
            const diferenciaDias = Math.floor((hoy - fechaInicio) / (1000 * 60 * 60 * 24));
            
            // Calculamos cuántas semanas (clases) han pasado
            let clasesTranscurridas = Math.floor(diferenciaDias / 7) + 1;
            if (clasesTranscurridas < 0) clasesTranscurridas = 0;

            const totalPagadas = pagos.length;
            const deuda = clasesTranscurridas - totalPagadas;

            document.getElementById('calc-clases-total').innerText = clasesTranscurridas;
            document.getElementById('calc-clases-pagadas').innerText = totalPagadas;
            document.getElementById('calc-clases-debe').innerText = deuda > 0 ? deuda : 0;

            // Render lista
            const content = document.getElementById('modal-content');
            content.innerHTML = pagos.length ? pagos.map(p => `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between">
                    <div>
                        <p class="text-[10px] font-black uppercase text-slate-800">SESIÓN ${p.numSesion || '?'}</p>
                        <p class="text-[8px] font-bold text-slate-400 uppercase">${p.fechaPago}</p>
                    </div>
                    <p class="text-sm font-black text-emerald-600">$${p.monto}</p>
                </div>
            `).join('') : '<p class="text-center text-[10px] font-bold text-slate-300 py-10 uppercase">Sin pagos registrados</p>';

            modal.classList.remove('hidden');
        };

        window.cerrarModal = () => document.getElementById('modal-historial').classList.add('hidden');

        // Renderizados Básicos
        function renderFinanzas() {
            const ui = document.getElementById('lista-transacciones');
            let i = 0, e = 0;
            ui.innerHTML = transacciones.slice(0,10).map(t => {
                const esIng = t.categoria.startsWith('ingreso');
                esIng ? i += Number(t.monto) : e += Number(t.monto);
                return `
                    <div class="bg-white p-3 rounded-xl border border-slate-100 flex justify-between items-center">
                        <p class="text-[9px] font-black uppercase">${t.alumno || t.descripcion}</p>
                        <p class="font-black text-xs ${esIng ? 'text-emerald-500' : 'text-rose-500'}">$${t.monto}</p>
                    </div>
                `;
            }).join('');
            document.getElementById('total-ingresos').innerText = `$${i}`;
            document.getElementById('total-egresos').innerText = `$${e}`;
            document.getElementById('total-balance').innerText = `$${i-e}`;
        }

        function renderAlumnos() {
            document.getElementById('ui-alumnos').innerHTML = alumnos.map(a => `
                <div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm">
                    <div>
                        <p class="font-black text-sm text-indigo-950 uppercase">${a.nombre}</p>
                        <p class="text-[8px] font-bold text-slate-400 uppercase">${a.curso}</p>
                    </div>
                    <button onclick="abrirHistorial('${a.nombre}')" class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl text-[9px] font-black uppercase">Estado Cuenta</button>
                </div>
            `).join('');
        }

        function renderCursos() {
            document.getElementById('ui-cursos').innerHTML = cursos.map(c => `
                <div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between">
                    <p class="font-black text-sm uppercase">${c.nombre}</p>
                    <p class="font-black text-sm text-indigo-500">$${c.costo}</p>
                </div>
            `).join('');
        }

        function populateSelects() {
            const selAlu = document.getElementById('select-alumno');
            const selCur = document.getElementById('select-curso-alumno');
            if(selAlu) selAlu.innerHTML = '<option value="">Alumno...</option>' + alumnos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            if(selCur) selCur.innerHTML = '<option value="">Curso...</option>' + cursos.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
        }

        // Formularios
        document.getElementById('finance-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "transacciones"), {
                categoria: document.getElementById('categoria').value,
                alumno: document.getElementById('select-alumno').value,
                monto: Number(document.getElementById('monto').value),
                numSesion: document.getElementById('num-sesion').value,
                fechaPago: document.getElementById('fecha-pago-real').value,
                descripcion: document.getElementById('descripcion').value,
                timestamp: serverTimestamp()
            });
            e.target.reset();
        };

        document.getElementById('alumno-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "alumnos"), {
                nombre: document.getElementById('nombre-alumno').value,
                curso: document.getElementById('select-curso-alumno').value,
                fechaInicio: document.getElementById('fecha-inicio-alumno').value
            });
            e.target.reset();
        };

        document.getElementById('curso-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "cursos"), {
                nombre: document.getElementById('nombre-curso').value,
                costo: document.getElementById('costo-clase').value,
                duracion: document.getElementById('duracion-curso').value
            });
            e.target.reset();
        };

        // Zona de Peligro
        window.solicitarLimpieza = (col, desc) => {
            pendieteLimpieza = col;
            document.getElementById('confirm-text').innerText = `Vas a borrar todos los ${desc}.`;
            document.getElementById('custom-confirm').classList.remove('hidden');
        };

        window.cerrarConfirmacion = () => document.getElementById('custom-confirm').classList.add('hidden');

        document.getElementById('confirm-yes').onclick = async () => {
            const snap = await getDocs(collection(db, pendieteLimpieza));
            await Promise.all(snap.docs.map(d => deleteDoc(doc(db, pendieteLimpieza, d.id))));
            cerrarConfirmacion();
        };

        // Export/Import
        window.exportarExcel = () => {
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(alumnos), "Alumnos");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(transacciones), "Pagos");
            XLSX.writeFile(wb, "Respaldo_SullyBec.xlsx");
        };

        window.importarExcel = (event) => {
            const reader = new FileReader();
            reader.onload = async (e) => {
                const wb = XLSX.read(e.target.result, {type: 'array'});
                const dataAlumnos = XLSX.utils.sheet_to_json(wb.Sheets["Alumnos"]);
                for(let a of dataAlumnos) await addDoc(collection(db, "alumnos"), a);
                alert("Importado con éxito");
            };
            reader.readAsArrayBuffer(event.target.files[0]);
        };

        window.toggleFields = () => {
            const isClase = document.getElementById('categoria').value === 'ingreso-clase';
            document.getElementById('fields-alumno').classList.toggle('hidden', !isClase);
        };
    </script>
</body>
</html>
