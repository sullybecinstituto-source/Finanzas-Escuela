<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sully Bec - Gestión Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary-color: #6366f1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { color: var(--primary-color); font-weight: 800; border-bottom: 3px solid var(--primary-color); }
        .balance-card { 
            background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%); 
            color: white;
        }
        .sticky-header { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #6366f1; }
        input:checked + .slider:before { transform: translateX(20px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 pb-10">

    <div class="sticky-header px-4 py-3">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black shadow-lg">SB</div>
                <div>
                    <h1 class="text-base font-extrabold text-indigo-950 leading-none">Sully Bec</h1>
                    <p class="text-[8px] font-bold text-rose-400 uppercase tracking-widest mt-0.5">Control Académico</p>
                </div>
            </div>
            <div id="status-badge" class="flex items-center gap-1.5 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <p class="text-[8px] font-black text-emerald-600 uppercase">Sistema Activo</p>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 pt-4">
        <div class="balance-card p-6 rounded-[2.5rem] shadow-2xl relative overflow-hidden mb-4">
            <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full -mr-16 -mt-16"></div>
            <p class="text-[10px] font-bold opacity-70 uppercase tracking-widest">Saldo Real en Caja</p>
            <h2 id="total-balance" class="text-4xl font-black mt-1">$0</h2>
            <div class="flex gap-6 mt-6">
                <div class="bg-white/10 p-3 rounded-2xl flex-1 border border-white/5">
                    <p class="text-[8px] font-bold uppercase opacity-60 mb-1">Ingresos Totales</p>
                    <p id="total-ingresos" class="text-lg font-black text-emerald-300">$0</p>
                </div>
                <div class="bg-white/10 p-3 rounded-2xl flex-1 border border-white/5">
                    <p class="text-[8px] font-bold uppercase opacity-60 mb-1">Egresos Totales</p>
                    <p id="total-egresos" class="text-lg font-black text-rose-300">$0</p>
                </div>
            </div>
        </div>

        <div class="bg-white border-2 border-indigo-100 p-5 rounded-[2rem] mb-6 shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 class="text-[10px] font-black text-indigo-900 uppercase">Ciclo de Renta (Día 15)</h3>
                    <p id="rango-corte" class="text-[9px] font-bold text-slate-500 bg-indigo-50 px-2 py-0.5 rounded-full inline-block mt-1">Calculando...</p>
                </div>
                <div class="text-right">
                    <p class="text-[8px] font-bold text-slate-400 uppercase">Disponible este mes</p>
                    <p id="period-balance" class="text-xl font-black text-indigo-600">$0</p>
                </div>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div id="period-progress" class="bg-indigo-500 h-full transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>

        <!-- Navegación -->
        <nav class="flex mb-6 bg-white p-1 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto no-scrollbar">
            <button onclick="switchTab('finanzas')" id="btn-finanzas" class="flex-1 min-w-[80px] py-3 text-[10px] font-black uppercase tab-active">Cobros</button>
            <button onclick="switchTab('gestion')" id="btn-gestion" class="flex-1 min-w-[80px] py-3 text-[10px] font-black uppercase text-slate-400">Alumnos</button>
            <button onclick="switchTab('cursos')" id="btn-cursos" class="flex-1 min-w-[80px] py-3 text-[10px] font-black uppercase text-slate-400">Diplomados</button>
        </nav>

        <section id="sec-finanzas" class="space-y-6">
            <div class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <form id="finance-form" class="space-y-4">
                    <select id="categoria" onchange="toggleFields()" class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm text-indigo-950 focus:ring-2 ring-indigo-200">
                        <optgroup label="➕ INGRESOS">
                            <option value="ingreso-clase">Pago de Clase (Alumno)</option>
                            <option value="ingreso-taller">Ingreso por Taller</option>
                            <option value="ingreso-material">Venta de Material</option>
                            <option value="ingreso-consulta">Consulta Médica/Terapias</option>
                            <option value="ingreso-renta-local">Renta de Consultorio</option>
                            <option value="ingreso-otro">Otros Ingresos</option>
                        </optgroup>
                        <optgroup label="➖ EGRESOS">
                            <option value="egreso-renta">Pago de Renta</option>
                            <option value="egreso-luz">Pago de Luz</option>
                            <option value="egreso-internet">Pago de Internet</option>
                            <option value="egreso-profesores">Pago a Profesores</option>
                            <option value="egreso-otros">Otros Egresos</option>
                        </optgroup>
                        <optgroup label="⚙️ SISTEMA">
                            <option value="ajuste-saldo">🔄 Ajuste / Saldo Inicial</option>
                        </optgroup>
                    </select>

                    <div id="fields-alumno" class="bg-indigo-50/50 p-4 rounded-2xl space-y-3 border border-indigo-100">
                        <select id="select-alumno" class="w-full bg-white border-none rounded-lg p-3 text-sm font-bold shadow-sm">
                            <option value="">Seleccionar Alumno...</option>
                        </select>
                        
                        <div class="flex items-center justify-between bg-white/50 p-2 rounded-xl px-3 border border-indigo-100/50">
                            <span class="text-[9px] font-black text-indigo-900 uppercase">¿Carga Histórica? (No afecta caja)</span>
                            <label class="switch">
                                <input type="checkbox" id="check-historico">
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <input type="number" id="num-sesion" placeholder="N° Sesión" class="w-full bg-white border-none rounded-lg p-3 text-xs font-bold">
                            <input type="date" id="fecha-pago-real" class="w-full bg-white border-none rounded-lg p-3 text-xs font-bold">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="monto" placeholder="Monto $" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        <input type="text" id="descripcion" placeholder="Notas..." class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase text-xs">Registrar Movimiento</button>
                </form>
            </div>

            <div id="lista-transacciones" class="space-y-2"></div>
        </section>

        <!-- Secciones Alumnos y Cursos... -->
        <section id="sec-gestion" class="hidden space-y-6">
            <div class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <form id="alumno-form" class="space-y-3">
                    <input type="text" id="nombre-alumno" placeholder="Nombre completo" required class="w-full bg-slate-50 rounded-xl p-3 text-sm font-bold">
                    <input type="text" id="curp-alumno" placeholder="CURP (18 caracteres)" maxlength="18" class="w-full bg-slate-50 rounded-xl p-3 text-sm font-bold uppercase">
                    <select id="select-curso-alumno" required class="w-full bg-slate-50 rounded-xl p-3 text-sm font-bold">
                        <option value="">Elegir Diplomado...</option>
                    </select>
                    <button type="submit" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-black text-xs uppercase">Inscribir Alumno</button>
                </form>
            </div>
            <div id="ui-alumnos" class="grid grid-cols-1 gap-3"></div>
        </section>

        <section id="sec-cursos" class="hidden space-y-6">
            <div class="bg-white border-2 border-slate-900 rounded-[2rem] p-6 shadow-sm">
                <form id="curso-form" class="space-y-3">
                    <input type="text" id="nombre-curso" placeholder="Nombre Diplomado" required class="w-full bg-slate-50 rounded-xl p-3 text-sm font-bold">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="duracion-curso" placeholder="Sesiones" required class="w-full bg-slate-50 rounded-xl p-3 text-sm font-bold">
                        <input type="number" id="costo-clase" placeholder="Costo Sesión $" required class="w-full bg-slate-50 rounded-xl p-3 text-sm font-bold">
                    </div>
                    <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black text-xs uppercase">Guardar Nuevo Curso</button>
                </form>
            </div>
            <div id="ui-cursos" class="space-y-3"></div>
            
            <div class="bg-slate-900 p-6 rounded-[2rem] text-white">
                <h3 class="text-[10px] font-black uppercase text-slate-400 mb-4">Mantenimiento</h3>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportarExcel()" class="bg-white/10 py-3 rounded-xl font-black text-[10px] uppercase">Exportar Todo</button>
                    <label class="bg-white/10 py-3 rounded-xl font-black text-[10px] uppercase text-center cursor-pointer">Importar<input type="file" class="hidden" onchange="importarExcel(event)"></label>
                </div>
                <button onclick="limpiarTodoElHistorial()" class="w-full bg-rose-600/20 border border-rose-500/30 text-rose-300 py-3 rounded-xl font-black text-[10px] uppercase mt-4">🔥 Borrar TODO el historial</button>
            </div>
        </section>
    </div>

    <!-- Modales -->
    <div id="modal-historial" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex items-end sm:items-center justify-center">
        <div class="bg-slate-50 w-full max-w-lg rounded-t-[2.5rem] sm:rounded-[2.5rem] h-[85vh] flex flex-col overflow-hidden">
            <div class="p-6 bg-indigo-600 text-white flex justify-between items-center">
                <div>
                    <h2 id="modal-nombre" class="text-xl font-black uppercase">Nombre</h2>
                    <p id="modal-curp" class="text-[8px] font-bold opacity-80"></p>
                </div>
                <button onclick="cerrarModal()" class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">&times;</button>
            </div>
            <div id="deuda-summary" class="bg-white p-6 grid grid-cols-3 gap-2 border-b border-slate-100 text-center">
                <div><p class="text-[8px] font-black text-slate-400 uppercase">Clases Hoy</p><p id="calc-clases-total" class="text-lg font-black">0</p></div>
                <div><p class="text-[8px] font-black text-slate-400 uppercase">Pagadas</p><p id="calc-clases-pagadas" class="text-lg font-black text-emerald-600">0</p></div>
                <div class="bg-rose-50 rounded-xl py-1"><p class="text-[8px] font-black text-rose-400 uppercase">Debe</p><p id="calc-clases-debe" class="text-lg font-black text-rose-600">0</p></div>
            </div>
            <div id="modal-content" class="flex-1 overflow-y-auto p-4 space-y-2 bg-white"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcAda5-ewiR78bfLyYrjEMhfdc0RFxd7s",
            authDomain: "finanzas-escuela.firebaseapp.com",
            projectId: "finanzas-escuela",
            storageBucket: "finanzas-escuela.firebasestorage.app",
            messagingSenderId: "106864276061",
            appId: "1:106864276061:web:cc8b26cca0ef07088f13b4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let transacciones = [], alumnos = [], cursos = [];

        window.switchTab = (t) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`sec-${t}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => {
                b.classList.remove('tab-active');
                b.classList.add('text-slate-400');
            });
            document.getElementById(`btn-${t}`).classList.add('tab-active');
            document.getElementById(`btn-${t}`).classList.remove('text-slate-400');
        };

        onSnapshot(query(collection(db, "transacciones"), orderBy("timestamp", "desc")), (snap) => {
            transacciones = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderFinanzas();
        });

        onSnapshot(query(collection(db, "alumnos"), orderBy("nombre", "asc")), (snap) => {
            alumnos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderAlumnos();
            populateSelects();
        });

        onSnapshot(query(collection(db, "cursos"), orderBy("nombre", "asc")), (snap) => {
            cursos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderCursos();
            populateSelects();
        });

        function renderFinanzas() {
            const ui = document.getElementById('lista-transacciones');
            let ingT = 0, egrT = 0, periodBal = 0;

            const hoy = new Date();
            const diaCorte = 15;
            let inicioPeriodo, finPeriodo;

            if (hoy.getDate() < diaCorte) {
                inicioPeriodo = new Date(hoy.getFullYear(), hoy.getMonth() - 1, diaCorte);
                finPeriodo = new Date(hoy.getFullYear(), hoy.getMonth(), diaCorte - 1);
            } else {
                inicioPeriodo = new Date(hoy.getFullYear(), hoy.getMonth(), diaCorte);
                finPeriodo = new Date(hoy.getFullYear(), hoy.getMonth() + 1, diaCorte - 1);
            }

            document.getElementById('rango-corte').innerText = `${inicioPeriodo.toLocaleDateString()} al ${finPeriodo.toLocaleDateString()}`;
            
            const transMes = transacciones.filter(t => {
                const f = new Date(t.fechaPago + "T12:00:00");
                return f >= inicioPeriodo && f <= finPeriodo;
            });

            ui.innerHTML = transacciones.slice(0, 15).map(t => {
                const esIng = t.categoria.startsWith('ingreso') && t.categoria !== 'ingreso-historico';
                const esHis = t.categoria === 'ingreso-historico';
                const m = Number(t.monto);

                if (esIng) ingT += m;
                if (t.categoria.startsWith('egreso')) egrT += m;
                if (t.categoria === 'ajuste-saldo') ingT += m;

                const f = new Date(t.fechaPago + "T12:00:00");
                if (f >= inicioPeriodo && f <= finPeriodo) {
                    if (esIng || t.categoria === 'ajuste-saldo') periodBal += m;
                    if (t.categoria.startsWith('egreso')) periodBal -= m;
                }

                return `
                    <div class="bg-white p-3 rounded-2xl border border-slate-100 flex justify-between items-center ${esHis ? 'opacity-40' : ''}">
                        <div>
                            <p class="text-[9px] font-black uppercase text-indigo-900">${t.alumno ? t.alumno : t.categoria.split('-')[1]}</p>
                            <p class="text-[7px] font-bold text-slate-400 uppercase">${t.fechaPago} ${t.descripcion ? '• ' + t.descripcion : ''}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <p class="font-black text-xs ${esHis ? 'text-slate-400' : (esIng || t.categoria === 'ajuste-saldo' ? 'text-emerald-500' : 'text-rose-500')}">
                                ${esHis ? '' : (esIng || t.categoria === 'ajuste-saldo' ? '+' : '-')}$${m}
                            </p>
                            <button onclick="borrarTransaccion('${t.id}')" class="text-rose-300 hover:text-rose-600 font-bold px-2">×</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('total-ingresos').innerText = `$${ingT}`;
            document.getElementById('total-egresos').innerText = `$${egrT}`;
            document.getElementById('total-balance').innerText = `$${ingT - egrT}`;
            document.getElementById('period-balance').innerText = `$${periodBal}`;

            const totalDias = (finPeriodo - inicioPeriodo) / (1000 * 60 * 60 * 24);
            const diasPasados = (hoy - inicioPeriodo) / (1000 * 60 * 60 * 24);
            document.getElementById('period-progress').style.width = Math.min(100, (diasPasados / totalDias) * 100) + '%';
        }

        window.abrirHistorial = (nombreAlumno) => {
            const alu = alumnos.find(a => a.nombre === nombreAlumno);
            const cur = cursos.find(c => c.nombre === alu.curso);
            const pagos = transacciones.filter(t => t.alumno === nombreAlumno && (t.categoria === 'ingreso-clase' || t.categoria === 'ingreso-historico'));

            document.getElementById('modal-nombre').innerText = alu.nombre;
            document.getElementById('modal-curp').innerText = alu.curp || 'SIN CURP REGISTRADO';

            let clasesTotal = 0;
            if (cur && cur.inicio) {
                const start = new Date(cur.inicio + "T00:00:00");
                const hoy = new Date();
                let temp = new Date(start);
                const susp = cur.feriados || [];

                while (temp <= hoy) {
                    const iso = temp.toISOString().split('T')[0];
                    if (!susp.includes(iso)) clasesTotal++;
                    temp.setDate(temp.getDate() + 7);
                }
            }

            const pagadas = pagos.length;
            document.getElementById('calc-clases-total').innerText = clasesTotal;
            document.getElementById('calc-clases-pagadas').innerText = pagadas;
            document.getElementById('calc-clases-debe').innerText = Math.max(0, clasesTotal - pagadas);

            document.getElementById('modal-content').innerHTML = pagos.map(p => `
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center">
                    <div>
                        <p class="text-[9px] font-black uppercase">Sesión ${p.numSesion || '?'}</p>
                        <p class="text-[7px] font-bold text-slate-400">${p.fechaPago} ${p.categoria === 'ingreso-historico' ? '• CARGA HISTÓRICA' : ''}</p>
                    </div>
                    <p class="text-xs font-black text-indigo-600">$${p.monto}</p>
                </div>
            `).join('') || '<p class="text-center py-10 text-[10px] font-bold text-slate-300">SIN REGISTROS</p>';

            document.getElementById('modal-historial').classList.remove('hidden');
        };

        window.cerrarModal = () => document.getElementById('modal-historial').classList.add('hidden');

        function renderCursos() {
            document.getElementById('ui-cursos').innerHTML = cursos.map(c => {
                let fin = "Definir Inicio";
                if (c.inicio && c.duracion) {
                    let d = new Date(c.inicio + "T00:00:00");
                    let count = 0;
                    const susp = c.feriados || [];
                    while (count < c.duracion - 1) {
                        d.setDate(d.getDate() + 7);
                        if (!susp.includes(d.toISOString().split('T')[0])) count++;
                    }
                    fin = d.toLocaleDateString();
                }
                return `
                    <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h4 class="font-black text-sm uppercase text-indigo-900">${c.nombre}</h4>
                                <p class="text-[8px] font-bold text-slate-400 uppercase">${c.duracion} sesiones • $${c.costo}/clase</p>
                            </div>
                            <button onclick="borrarCurso('${c.id}')" class="text-rose-200">×</button>
                        </div>
                        <div class="flex items-center justify-between bg-slate-50 p-3 rounded-2xl">
                            <div>
                                <p class="text-[7px] font-bold text-slate-400 uppercase">Término Estimado</p>
                                <p class="text-[10px] font-black text-indigo-600">${fin}</p>
                            </div>
                            <button onclick="gestionarCurso('${c.id}')" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-[8px] font-black uppercase">Gestionar</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('finance-form').onsubmit = async (e) => {
            e.preventDefault();
            const cat = document.getElementById('categoria').value;
            const esHis = document.getElementById('check-historico').checked;
            
            await addDoc(collection(db, "transacciones"), {
                categoria: (cat === 'ingreso-clase' && esHis) ? 'ingreso-historico' : cat,
                alumno: (cat === 'ingreso-clase') ? document.getElementById('select-alumno').value : '',
                monto: Number(document.getElementById('monto').value),
                numSesion: (cat === 'ingreso-clase') ? document.getElementById('num-sesion').value : '',
                fechaPago: document.getElementById('fecha-pago-real').value || new Date().toISOString().split('T')[0],
                descripcion: document.getElementById('descripcion').value,
                timestamp: serverTimestamp()
            });
            e.target.reset();
            toggleFields();
        };

        window.toggleFields = () => {
            const cat = document.getElementById('categoria').value;
            document.getElementById('fields-alumno').classList.toggle('hidden', cat !== 'ingreso-clase');
        };

        document.getElementById('alumno-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "alumnos"), {
                nombre: document.getElementById('nombre-alumno').value,
                curp: document.getElementById('curp-alumno').value,
                curso: document.getElementById('select-curso-alumno').value
            });
            e.target.reset();
        };

        document.getElementById('curso-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "cursos"), {
                nombre: document.getElementById('nombre-curso').value,
                duracion: Number(document.getElementById('duracion-curso').value),
                costo: Number(document.getElementById('costo-clase').value),
                feriados: [],
                inicio: ""
            });
            e.target.reset();
        };

        function renderAlumnos() {
            document.getElementById('ui-alumnos').innerHTML = alumnos.map(a => `
                <div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                    <div>
                        <p class="font-black text-sm text-indigo-950 uppercase">${a.nombre}</p>
                        <p class="text-[7px] font-bold text-slate-400 uppercase">${a.curso} ${a.curp ? '• ' + a.curp : ''}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="abrirHistorial('${a.nombre}')" class="bg-indigo-50 text-indigo-600 px-3 py-2 rounded-xl text-[8px] font-black uppercase">Estado</button>
                        <button onclick="borrarAlumno('${a.id}')" class="text-rose-300 text-xl font-bold">×</button>
                    </div>
                </div>
            `).join('');
        }

        function populateSelects() {
            const sA = document.getElementById('select-alumno');
            const sC = document.getElementById('select-curso-alumno');
            if(sA) sA.innerHTML = '<option value="">Alumno...</option>' + alumnos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            if(sC) sC.innerHTML = '<option value="">Diplomado...</option>' + cursos.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
        }

        window.borrarTransaccion = async (id) => { if(confirm('¿Borrar este movimiento?')) await deleteDoc(doc(db, "transacciones", id)); };
        window.borrarAlumno = async (id) => { if(confirm('¿Eliminar alumno?')) await deleteDoc(doc(db, "alumnos", id)); };
        window.borrarCurso = async (id) => { if(confirm('¿Eliminar diplomado?')) await deleteDoc(doc(db, "cursos", id)); };
        window.limpiarTodoElHistorial = async () => {
            if(confirm('ATENCIÓN: Se borrarán TODOS los registros de pagos. ¿Continuar?')){
                const s = await getDocs(collection(db, "transacciones"));
                await Promise.all(s.docs.map(d => deleteDoc(doc(db, "transacciones", d.id))));
            }
        };

        window.onload = () => { toggleFields(); };
    </script>
</body>
</html>
