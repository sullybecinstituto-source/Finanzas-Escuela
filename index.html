<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SullyBec Instituto - Gestión Integral</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { --primary-color: #6366f1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { color: var(--primary-color); font-weight: 800; border-bottom: 3px solid var(--primary-color); }
        .balance-card { background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%); }
        .sticky-header { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        
        .logo-box { background: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1); overflow: hidden; }

        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #f43f5e; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        input, select { outline: none !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <div class="sticky-header px-4 py-3">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="logo-box w-11 h-11 rounded-xl flex items-center justify-center border border-slate-200">
                    <img src="https://lh3.googleusercontent.com/d/1gjM8QJhfynpT0il86P3IRWwD_wMQWcCC" 
                         alt="SullyBec Logo" 
                         class="w-full h-full object-cover"
                         onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'text-indigo-600 font-black text-xl\'>SB</span>';">
                </div>
                <div>
                    <h1 class="text-lg font-extrabold text-indigo-950 tracking-tight leading-none">SullyBec</h1>
                    <p class="text-[8px] font-bold text-rose-400 uppercase tracking-widest mt-0.5">Instituto</p>
                </div>
            </div>
            <div id="status-cloud" class="flex items-center gap-1.5 bg-slate-100 px-3 py-1 rounded-full">
                <span class="w-2 h-2 rounded-full bg-slate-400 animate-pulse"></span>
                <p id="status-text" class="text-[9px] font-black text-slate-500 uppercase tracking-tighter">Conectando...</p>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 pt-4 pb-24">
        <!-- Dashboard Card -->
        <div class="balance-card p-6 rounded-[2rem] text-white mb-6 shadow-xl text-center">
            <p class="text-[10px] font-bold opacity-70 uppercase tracking-widest">Saldo en Caja (Real)</p>
            <h2 id="total-balance" class="text-5xl font-black mt-1">$0</h2>
            <div class="flex justify-center gap-8 mt-6">
                <div><p class="text-[9px] font-bold uppercase opacity-60">Ingresos</p><p id="total-ingresos" class="text-sm font-black text-emerald-300">$0</p></div>
                <div><p class="text-[9px] font-bold uppercase opacity-60">Egresos</p><p id="total-egresos" class="text-sm font-black text-rose-300">$0</p></div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="flex mb-6 bg-white p-1 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
            <button onclick="switchTab('finanzas')" id="btn-finanzas" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase tab-active whitespace-nowrap">Cobros Rápidos</button>
            <button onclick="switchTab('gestion')" id="btn-gestion" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase text-slate-400 whitespace-nowrap">Alumnos</button>
            <button onclick="switchTab('cursos')" id="btn-cursos" class="flex-1 min-w-[100px] py-3 text-[10px] font-black uppercase text-slate-400 whitespace-nowrap">Diplomados</button>
        </nav>

        <!-- SECCIÓN FINANZAS -->
        <section id="sec-finanzas" class="space-y-6">
            <div class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nuevo Movimiento</h3>
                    <div class="flex items-center gap-2 bg-rose-50 px-3 py-1.5 rounded-xl border border-rose-100">
                        <span class="text-[8px] font-black text-rose-600 uppercase">Historial (No suma)</span>
                        <label class="switch"><input type="checkbox" id="solo-historial"><span class="slider"></span></label>
                    </div>
                </div>

                <form id="finance-form" class="space-y-4">
                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Concepto</label>
                        <select id="categoria" onchange="toggleFields()" class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm text-indigo-950">
                            <optgroup label="Cobros / Ingresos">
                                <option value="ingreso-clase">Pago de Clase (Diplomado)</option>
                                <option value="ingreso-taller">Pago Único por Taller</option>
                                <option value="ingreso-paciente">Atención de Pacientes</option>
                                <option value="ingreso-renta">Renta de Consultorio</option>
                                <option value="ingreso-otro">Otro Ingreso</option>
                            </optgroup>
                            <optgroup label="Gastos / Egresos">
                                <option value="egreso-renta">Pago de Renta (Local)</option>
                                <option value="egreso-luz">Pago de Luz</option>
                                <option value="egreso-internet">Pago de Internet</option>
                                <option value="egreso-profesores">Pago a Profesores</option>
                                <option value="egreso-gastos">Otro Egreso / Gasto General</option>
                            </optgroup>
                        </select>
                    </div>

                    <div id="fields-alumno" class="bg-indigo-50/50 p-4 rounded-2xl space-y-3 border border-indigo-100">
                        <select id="select-alumno" onchange="autoSugerirPago()" class="w-full bg-white border-none rounded-lg p-3 text-sm font-bold shadow-sm text-indigo-900">
                            <option value="">Seleccionar Alumno...</option>
                        </select>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="block text-[9px] font-bold text-indigo-400 mb-1 uppercase">Sesión N°</label><input type="number" id="num-sesion" class="w-full bg-white border-none rounded-lg p-3 text-xs font-bold shadow-sm"></div>
                            <div><label class="block text-[9px] font-bold text-indigo-400 mb-1 uppercase">Fecha que paga</label><input type="date" id="fecha-clase-corresponde" class="w-full bg-white border-none rounded-lg p-3 text-xs font-bold shadow-sm"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Fecha Recibo</label>
                            <input type="date" id="fecha-pago-real" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Monto $</label>
                            <input type="number" id="monto" placeholder="0.00" required class="w-full bg-slate-50 border-none rounded-xl p-3 font-bold text-sm">
                        </div>
                    </div>

                    <input type="text" id="descripcion" placeholder="Notas adicionales..." class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">
                    <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase text-xs">Registrar Movimiento</button>
                </form>
            </div>
            
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-2">Movimientos Recientes</h3>
            <div id="lista-transacciones" class="space-y-2"></div>
        </section>

        <!-- SECCIÓN ALUMNOS -->
        <section id="sec-gestion" class="hidden space-y-6">
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest text-center">Centro de Respaldo Integral</p>
                <div class="flex gap-2">
                    <button onclick="exportToCSV()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl text-[9px] font-black uppercase shadow-md flex items-center justify-center gap-2">
                        <span>⬇️</span> Excel
                    </button>
                    <button onclick="document.getElementById('import-file').click()" class="flex-1 bg-amber-500 text-white py-3 rounded-xl text-[9px] font-black uppercase shadow-md flex items-center justify-center gap-2">
                        <span>⬆️</span> Subir
                    </button>
                </div>
                <input type="file" id="import-file" class="hidden" accept=".csv" onchange="importFromCSV(event)">
            </div>

            <div id="form-alumno-container" class="bg-white border-2 border-indigo-100 rounded-[2rem] p-6 shadow-sm">
                <h3 id="form-alumno-title" class="text-[11px] font-black text-indigo-600 uppercase mb-4">Registro de Alumno</h3>
                <form id="alumno-form" class="space-y-3">
                    <input type="hidden" id="edit-id-alumno">
                    <input type="text" id="nombre-alumno" placeholder="Nombre Completo" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                    <select id="select-curso-alumno" onchange="syncAlumnoFechaSugerida()" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                        <option value="">Seleccionar Diplomado...</option>
                    </select>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="curp-alumno" placeholder="CURP" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                        <input type="tel" id="tel-alumno" placeholder="Teléfono" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                    </div>
                    <div class="bg-indigo-50 p-3 rounded-xl">
                        <label class="block text-[9px] font-black text-indigo-400 uppercase mb-1">Primer Pago Corresponde a:</label>
                        <input type="date" id="fecha-inicio-alumno" required class="w-full bg-white border-none rounded-lg p-3 text-sm font-bold shadow-sm">
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-alumno" class="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase">Guardar Alumno</button>
                        <button type="button" onclick="resetFormAlumno()" id="btn-cancelar-edit-alum" class="hidden bg-slate-200 text-slate-500 py-4 px-6 rounded-xl font-black text-xs uppercase">X</button>
                    </div>
                </form>
            </div>
            <div id="ui-alumnos" class="grid grid-cols-1 gap-3"></div>
        </section>

        <!-- SECCIÓN CURSOS -->
        <section id="sec-cursos" class="hidden space-y-6">
            <div id="form-curso-container" class="bg-white border-2 border-slate-900 rounded-[2rem] p-6 shadow-sm">
                <h3 id="form-curso-title" class="text-[10px] font-black text-slate-400 uppercase mb-4">Configurar Diplomado</h3>
                <form id="curso-form" class="space-y-4">
                    <input type="hidden" id="edit-id-curso">
                    <input type="text" id="nombre-curso" placeholder="Nombre del Diplomado" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="date" id="fecha-inicio-curso" onchange="recalcularFechaFin()" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                        <input type="text" id="fecha-fin-curso" readonly placeholder="Fin calculado" class="w-full bg-slate-100 border-none rounded-xl p-3 text-sm font-bold text-indigo-600">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="duracion-curso" oninput="recalcularFechaFin()" placeholder="Total Sesiones" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                        <input type="number" id="costo-clase" placeholder="Costo Sesión $" required class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl">
                        <div class="flex gap-2 mb-3">
                            <input type="date" id="fecha-festiva" class="flex-1 bg-white border-none rounded-lg p-2 text-xs font-bold">
                            <button type="button" onclick="agregarFechaFestiva()" class="bg-rose-500 text-white px-4 rounded-lg text-[9px] font-black">Add Festivo</button>
                        </div>
                        <div id="lista-festivos" class="flex flex-wrap gap-1"></div>
                        <input type="hidden" id="festivos-json" value="[]">
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-curso" class="flex-1 bg-slate-900 text-white py-4 rounded-xl font-black text-xs uppercase">Guardar Diplomado</button>
                        <button type="button" onclick="resetFormCurso()" id="btn-cancelar-curso" class="hidden bg-slate-200 text-slate-500 py-4 px-6 rounded-xl font-black text-xs uppercase">X</button>
                    </div>
                </form>
            </div>
            <div id="ui-cursos" class="space-y-3"></div>
        </section>
    </div>

    <!-- FIREBASE SETUP -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sullybec-gest-advanced';

        let user = null;
        let dataAlumnos = [];
        let dataCursos = [];
        let dataPagos = [];

        const initAuth = async () => {
            try { await signInAnonymously(auth); } catch (err) { updateStatus(false, "Error Red"); }
        };

        onAuthStateChanged(auth, (u) => {
            if (u) { user = u; updateStatus(true, "En Línea"); startListeners(); } else { initAuth(); }
        });

        function updateStatus(connected, text) {
            const status = document.getElementById('status-cloud');
            const statusText = document.getElementById('status-text');
            statusText.innerText = text;
            status.innerHTML = connected ? 
                `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><p class="text-[9px] font-black text-slate-500 uppercase">${text}</p>` :
                `<span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span><p class="text-[9px] font-black text-slate-500 uppercase">${text}</p>`;
        }

        function startListeners() {
            if (!user) return;
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'cursos'), (snap) => {
                dataCursos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCursos();
                updateSelects();
            });

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'alumnos'), (snap) => {
                dataAlumnos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderAlumnos();
                updateSelects();
            });

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'pagos'), (snap) => {
                dataPagos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderPagos();
                calculateTotals();
                updateStatus(true, "Datos Listos");
            });
        }

        window.exportToCSV = () => {
            if (dataPagos.length === 0 && dataAlumnos.length === 0 && dataCursos.length === 0) return;
            let csvContent = "\uFEFF"; 
            csvContent += "CATEGORIA,IDENTIFICADOR,CONCEPTO,MONTO,FECHA_RECIBO,FECHA_CORRESPONDE,NOTAS\n";
            dataPagos.forEach(p => {
                const persona = p.alumnoId ? (dataAlumnos.find(a => a.id === p.alumnoId)?.nombre || 'Alumno') : 'General';
                const tipo = p.categoria.includes('egreso') ? 'EGRESO' : 'INGRESO';
                csvContent += `${tipo},"${persona}","${p.categoria}",${p.monto},"${p.fechaRecibo}","${p.fechaCorresponde || ''}","${p.descripcion || ''}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", `Respaldo_SullyBec_${new Date().toISOString().split('T')[0]}.csv`);
            link.click();
        };

        window.importFromCSV = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const rows = e.target.result.split('\n').slice(1);
                for (let row of rows) {
                    if (!row.trim()) continue;
                    const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
                    const clean = cols.map(c => c.replace(/"/g, '').trim());
                    const [cat, ident, concepto, monto, fechaR, fechaC, desc] = clean;
                    if (cat === 'INGRESO' || cat === 'EGRESO') {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'pagos'), {
                            categoria: concepto, monto: parseFloat(monto) || 0, fechaRecibo: fechaR,
                            fechaCorresponde: fechaC, descripcion: desc, alumnoId: '', timestamp: Date.now()
                        });
                    }
                }
                alert("Importación de movimientos finalizada.");
            };
            reader.readAsText(file);
        };

        window.calcularCalendario = (inicioStr, numSesiones, festivosArr) => {
            let fechas = [];
            let curr = new Date(inicioStr + 'T00:00:00');
            let festivos = festivosArr.map(f => f.split('T')[0]);
            while (fechas.length < numSesiones) {
                let iso = curr.toISOString().split('T')[0];
                if (!festivos.includes(iso)) fechas.push(iso);
                curr.setDate(curr.getDate() + 7);
            }
            return fechas;
        };

        window.recalcularFechaFin = () => {
            const inicio = document.getElementById('fecha-inicio-curso').value;
            const sesiones = parseInt(document.getElementById('duracion-curso').value);
            const festivos = JSON.parse(document.getElementById('festivos-json').value);
            if (inicio && sesiones > 0) {
                const cal = calcularCalendario(inicio, sesiones, festivos);
                document.getElementById('fecha-fin-curso').value = cal[cal.length - 1];
            }
        };

        window.agregarFechaFestiva = () => {
            const f = document.getElementById('fecha-festiva').value;
            if (!f) return;
            let current = JSON.parse(document.getElementById('festivos-json').value);
            if (!current.includes(f)) {
                current.push(f);
                document.getElementById('festivos-json').value = JSON.stringify(current);
                renderFestivosUI();
                recalcularFechaFin();
            }
        };

        function renderFestivosUI() {
            const festivos = JSON.parse(document.getElementById('festivos-json').value);
            document.getElementById('lista-festivos').innerHTML = festivos.map(f => `
                <span class="bg-indigo-100 text-indigo-600 text-[8px] font-black px-2 py-1 rounded flex items-center gap-1">
                    ${f} <button type="button" onclick="removerFestivo('${f}')" class="text-rose-500">×</button>
                </span>
            `).join('');
        }

        window.removerFestivo = (f) => {
            let current = JSON.parse(document.getElementById('festivos-json').value);
            current = current.filter(x => x !== f);
            document.getElementById('festivos-json').value = JSON.stringify(current);
            renderFestivosUI();
            recalcularFechaFin();
        };

        window.autoSugerirPago = () => {
            const alumId = document.getElementById('select-alumno').value;
            const alum = dataAlumnos.find(a => a.id === alumId);
            if (!alum) return;
            const curso = dataCursos.find(c => c.id === alum.cursoId);
            if (!curso) return;
            document.getElementById('monto').value = curso.costo;
            const pagosPrevios = dataPagos.filter(p => p.alumnoId === alumId && p.categoria === 'ingreso-clase').length;
            document.getElementById('num-sesion').value = pagosPrevios + 1;
            const cal = calcularCalendario(alum.fechaInicio, curso.sesiones, curso.festivos || []);
            if (cal[pagosPrevios]) {
                document.getElementById('fecha-clase-corresponde').value = cal[pagosPrevios];
                document.getElementById('descripcion').value = `PAGO SESIÓN ${pagosPrevios + 1} - ${alum.nombre}`;
            }
        };

        window.syncAlumnoFechaSugerida = () => {
            const curId = document.getElementById('select-curso-alumno').value;
            const curso = dataCursos.find(c => c.id === curId);
            if (curso) document.getElementById('fecha-inicio-alumno').value = curso.inicio;
        };

        document.getElementById('finance-form').onsubmit = async (e) => {
            e.preventDefault();
            const p = {
                categoria: document.getElementById('categoria').value,
                monto: parseFloat(document.getElementById('monto').value),
                fechaRecibo: document.getElementById('fecha-pago-real').value,
                fechaCorresponde: document.getElementById('fecha-clase-corresponde').value,
                descripcion: document.getElementById('descripcion').value,
                alumnoId: document.getElementById('select-alumno').value,
                numSesion: parseInt(document.getElementById('num-sesion').value) || 0,
                soloHistorial: document.getElementById('solo-historial').checked,
                timestamp: Date.now()
            };
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'pagos'), p);
            e.target.reset();
            document.getElementById('fecha-pago-real').value = new Date().toISOString().split('T')[0];
        };

        document.getElementById('alumno-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id-alumno').value;
            const p = {
                nombre: document.getElementById('nombre-alumno').value,
                cursoId: document.getElementById('select-curso-alumno').value,
                curp: document.getElementById('curp-alumno').value,
                tel: document.getElementById('tel-alumno').value,
                fechaInicio: document.getElementById('fecha-inicio-alumno').value
            };
            if(id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'alumnos', id), p);
            else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'alumnos'), p);
            resetFormAlumno();
        };

        document.getElementById('curso-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id-curso').value;
            const p = {
                nombre: document.getElementById('nombre-curso').value,
                inicio: document.getElementById('fecha-inicio-curso').value,
                sesiones: parseInt(document.getElementById('duracion-curso').value),
                costo: parseFloat(document.getElementById('costo-clase').value),
                festivos: JSON.parse(document.getElementById('festivos-json').value)
            };
            if(id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cursos', id), p);
            else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'cursos'), p);
            resetFormCurso();
        };

        function updateSelects() {
            document.getElementById('select-alumno').innerHTML = '<option value="">Seleccionar Alumno...</option>' + 
                dataAlumnos.map(a => `<option value="${a.id}">${a.nombre}</option>`).join('');
            document.getElementById('select-curso-alumno').innerHTML = '<option value="">Seleccionar Diplomado...</option>' + 
                dataCursos.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
        }

        function renderAlumnos() {
            document.getElementById('ui-alumnos').innerHTML = dataAlumnos.map(a => {
                const c = dataCursos.find(x => x.id === a.cursoId);
                return `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center">
                    <div><p class="font-black text-sm text-indigo-900 leading-tight">${a.nombre}</p><p class="text-[8px] font-bold text-slate-400 uppercase mt-1">${c?.nombre || 'S/D'}</p></div>
                    <button onclick="editAlumno('${a.id}')" class="bg-indigo-50 text-indigo-600 px-3 py-2 rounded-lg text-[9px] font-black uppercase">Editar</button>
                </div>`;
            }).join('');
        }

        function renderCursos() {
            document.getElementById('ui-cursos').innerHTML = dataCursos.map(c => `
                <div class="bg-slate-900 text-white p-5 rounded-[2rem] shadow-xl relative overflow-hidden">
                    <h4 class="text-xs font-black text-rose-400 uppercase tracking-widest">${c.nombre}</h4>
                    <div class="grid grid-cols-2 gap-4 mt-4">
                        <div><p class="text-[8px] opacity-50 font-bold">Sesiones</p><p class="text-sm font-black">${c.sesiones}</p></div>
                        <div><p class="text-[8px] opacity-50 font-bold">Costo</p><p class="text-sm font-black text-emerald-400">$${c.costo}</p></div>
                    </div>
                    <button onclick="editCurso('${c.id}')" class="mt-4 w-full bg-white/10 py-2 rounded-xl text-[9px] font-black">Ajustar</button>
                </div>`).join('');
        }

        function renderPagos() {
            const list = document.getElementById('lista-transacciones');
            const sorted = [...dataPagos].sort((a,b) => b.timestamp - a.timestamp);
            list.innerHTML = sorted.map(t => `
                <div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm">
                    <div class="flex-1">
                        <p class="text-[10px] font-black text-slate-800 uppercase leading-none">${t.descripcion || t.categoria}</p>
                        <p class="text-[8px] font-bold text-slate-400 uppercase mt-1.5">Recibo: ${t.fechaRecibo} | ${t.fechaCorresponde || 'N/A'}</p>
                    </div>
                    <div class="text-right ml-4">
                        <p class="font-black text-sm ${t.categoria.includes('egreso') ? 'text-rose-500' : 'text-emerald-500'}">$${t.monto}</p>
                        <button onclick="window.deleteDoc('pagos', '${t.id}')" class="text-[7px] text-slate-300 uppercase font-black">Borrar</button>
                    </div>
                </div>`).join('');
        }

        function calculateTotals() {
            let i = 0, e = 0;
            dataPagos.forEach(t => { if(!t.soloHistorial) { if(t.categoria.includes('egreso')) e += t.monto; else i += t.monto; } });
            document.getElementById('total-ingresos').innerText = `$${i}`;
            document.getElementById('total-egresos').innerText = `$${e}`;
            document.getElementById('total-balance').innerText = `$${i - e}`;
        }

        window.editAlumno = (id) => {
            const a = dataAlumnos.find(x => x.id === id);
            document.getElementById('edit-id-alumno').value = a.id;
            document.getElementById('nombre-alumno').value = a.nombre;
            document.getElementById('select-curso-alumno').value = a.cursoId;
            document.getElementById('curp-alumno').value = a.curp || '';
            document.getElementById('tel-alumno').value = a.tel || '';
            document.getElementById('fecha-inicio-alumno').value = a.fechaInicio;
            document.getElementById('form-alumno-title').innerText = "Editando Alumno";
            document.getElementById('btn-cancelar-edit-alum').classList.remove('hidden');
            switchTab('gestion');
        };

        window.editCurso = (id) => {
            const c = dataCursos.find(x => x.id === id);
            document.getElementById('edit-id-curso').value = c.id;
            document.getElementById('nombre-curso').value = c.nombre;
            document.getElementById('fecha-inicio-curso').value = c.inicio;
            document.getElementById('duracion-curso').value = c.sesiones;
            document.getElementById('costo-clase').value = c.costo;
            document.getElementById('festivos-json').value = JSON.stringify(c.festivos || []);
            renderFestivosUI(); recalcularFechaFin();
            document.getElementById('btn-cancelar-curso').classList.remove('hidden');
            switchTab('cursos');
        };

        window.deleteDoc = async (col, id) => {
            if(confirm("¿Eliminar registro?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', col, id));
        };

        window.resetFormAlumno = () => {
            document.getElementById('alumno-form').reset();
            document.getElementById('edit-id-alumno').value = '';
            document.getElementById('btn-cancelar-edit-alum').classList.add('hidden');
        };

        window.resetFormCurso = () => {
            document.getElementById('curso-form').reset();
            document.getElementById('edit-id-curso').value = '';
            document.getElementById('btn-cancelar-curso').classList.add('hidden');
        };

        window.switchTab = (t) => {
            ['finanzas', 'gestion', 'cursos'].forEach(s => {
                document.getElementById('sec-' + s).classList.toggle('hidden', s !== t);
                document.getElementById('btn-' + s).classList.toggle('tab-active', s === t);
            });
        };

        window.toggleFields = () => {
            const c = document.getElementById('categoria').value;
            document.getElementById('fields-alumno').classList.toggle('hidden', c !== 'ingreso-clase');
        };

        document.getElementById('fecha-pago-real').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
