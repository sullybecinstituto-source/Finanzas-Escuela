<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Finanzas - Escuela de Terapias (Nube)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12 text-slate-900">

    <div class="max-w-4xl mx-auto px-4 pt-8">
        <!-- Encabezado -->
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Escuela & Consultorio</h1>
                <div class="flex items-center gap-2 mt-1">
                    <span id="cloud-status" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <p id="status-text" class="text-xs text-slate-500 font-medium uppercase tracking-wider">Conectando a la nube...</p>
                </div>
            </div>
            <div id="balance-global" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex gap-6">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Ingresos</p>
                    <p id="total-ingresos" class="text-xl font-bold text-emerald-600">$0.00</p>
                </div>
                <div class="border-l border-slate-100 pl-6">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Egresos</p>
                    <p id="total-egresos" class="text-xl font-bold text-rose-600">$0.00</p>
                </div>
            </div>
        </header>

        <!-- Formulario de Registro -->
        <div class="glass border border-slate-200 rounded-3xl p-6 mb-8 shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-slate-700 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
                Nuevo Registro Sincronizado
            </h2>
            <form id="finance-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-1">
                    <label class="block text-xs font-medium text-slate-500 mb-1">Fecha</label>
                    <input type="date" id="fecha" required class="w-full bg-slate-100 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-medium text-slate-500 mb-1">Categoría</label>
                    <select id="tipo" class="w-full bg-slate-100 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500">
                        <optgroup label="Ingresos">
                            <option value="ingreso-clase">Pago Alumno (Clase)</option>
                            <option value="ingreso-paciente">Atención Paciente</option>
                            <option value="ingreso-renta-consultorio">Renta de Consultorio</option>
                            <option value="ingreso-otro">Otro Ingreso</option>
                        </optgroup>
                        <optgroup label="Egresos">
                            <option value="egreso-profesor">Pago a Profesor</option>
                            <option value="egreso-insumos">Insumos/Materiales</option>
                            <option value="egreso-renta">Renta Local</option>
                            <option value="egreso-servicios">Servicios (Luz/Agua)</option>
                            <option value="egreso-otro">Otro Egreso</option>
                        </optgroup>
                    </select>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-medium text-slate-500 mb-1">Monto ($)</label>
                    <input type="number" id="monto" step="0.01" placeholder="0.00" required class="w-full bg-slate-100 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-1 flex items-end">
                    <button type="submit" id="submit-btn" disabled class="w-full bg-slate-400 text-white font-semibold py-3 rounded-xl transition-all shadow-lg opacity-50 cursor-not-allowed">
                        Conectando...
                    </button>
                </div>
                <div class="md:col-span-4">
                    <label class="block text-xs font-medium text-slate-500 mb-1">Descripción</label>
                    <input type="text" id="descripcion" placeholder="Ej: Pago mensual Alumno Juan" required class="w-full bg-slate-100 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
            </form>
        </div>

        <!-- Herramientas -->
        <div class="flex flex-col sm:flex-row items-center justify-between mb-6 gap-4">
            <h2 class="text-xl font-bold text-slate-800 tracking-tight">Historial en Tiempo Real</h2>
            <div class="flex items-center gap-3 bg-white p-2 rounded-2xl shadow-sm border border-slate-100 w-full sm:w-auto justify-center">
                <button onclick="exportarCSV()" class="flex-1 sm:flex-none text-[11px] font-bold text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-xl border border-indigo-100 uppercase transition-all">
                    Descargar Excel
                </button>
            </div>
        </div>

        <!-- Tabla -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-50 flex items-center justify-between">
                <div class="flex items-center gap-2 text-sm font-semibold text-slate-500 uppercase tracking-widest">
                    <input type="date" id="filtro-fecha" class="border-none bg-slate-50 rounded-lg p-1 focus:ring-0 text-slate-700">
                </div>
                <div id="resumen-dia" class="text-sm font-bold text-slate-600"></div>
            </div>
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-slate-400 text-[10px] uppercase tracking-widest">
                        <tr>
                            <th class="px-6 py-4 font-semibold">Fecha</th>
                            <th class="px-6 py-4 font-semibold">Concepto</th>
                            <th class="px-6 py-4 font-semibold text-right">Monto</th>
                            <th class="px-6 py-4 font-semibold text-center"></th>
                        </tr>
                    </thead>
                    <tbody id="lista-transacciones" class="divide-y divide-slate-100 text-slate-700"></tbody>
                </table>
            </div>
            <div id="empty-state" class="p-12 text-center text-slate-400 hidden">
                <p>No hay registros disponibles en la nube.</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- PEGA AQUÍ TUS DATOS DE FIREBASE QUE COPIASTE ---
        const firebaseConfig = {
          apiKey: "AIzaSyCcAda5-ewiR78bfLyYrjEMhfdc0RFxd7s",
          authDomain: "finanzas-escuela.firebaseapp.com",
          projectId: "finanzas-escuela",
          storageBucket: "finanzas-escuela.firebasestorage.app",
          messagingSenderId: "106864276061",
          appId: "1:106864276061:web:cc8b26cca0ef07088f13b4"
        };
        // ----------------------------------------

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const financeCollection = collection(db, "transacciones");

        let transacciones = [];
        const form = document.getElementById('finance-form');
        const submitBtn = document.getElementById('submit-btn');
        const statusPill = document.getElementById('cloud-status');
        const statusText = document.getElementById('status-text');
        const filtroFechaEl = document.getElementById('filtro-fecha');
        const lista = document.getElementById('lista-transacciones');
        const totalIngresosEl = document.getElementById('total-ingresos');
        const totalEgresosEl = document.getElementById('total-egresos');
        const resumenDiaEl = document.getElementById('resumen-dia');

        const hoyStr = new Date().toISOString().split('T')[0];
        document.getElementById('fecha').value = hoyStr;
        filtroFechaEl.value = hoyStr;

        // Escuchar cambios en la base de datos
        const q = query(financeCollection, orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            transacciones = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            
            statusPill.classList.replace('bg-amber-400', 'bg-emerald-500');
            statusPill.classList.remove('animate-pulse');
            statusText.innerText = "Conectado a la nube";
            submitBtn.disabled = false;
            submitBtn.innerText = "Registrar";
            submitBtn.className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-200 cursor-pointer";
            
            renderizar();
        }, (error) => {
            console.error("Error:", error);
            statusPill.classList.replace('bg-amber-400', 'bg-rose-500');
            statusText.innerText = "Error de conexión: Revisa tus claves";
        });

        form.onsubmit = async (e) => {
            e.preventDefault();
            const categoria = document.getElementById('tipo').value;
            const tipoBasico = categoria.startsWith('ingreso') ? 'ingreso' : 'egreso';

            const nueva = {
                fecha: document.getElementById('fecha').value,
                categoria: categoria,
                tipo: tipoBasico,
                monto: parseFloat(document.getElementById('monto').value),
                descripcion: document.getElementById('descripcion').value,
                timestamp: Date.now()
            };

            try {
                await addDoc(financeCollection, nueva);
                form.reset();
                document.getElementById('fecha').value = hoyStr;
            } catch (e) {
                alert("Error al guardar en la nube");
            }
        };

        window.eliminarTransaccion = async (id) => {
            if(confirm('¿Deseas eliminar este registro para todos?')) {
                try {
                    await deleteDoc(doc(db, "transacciones", id));
                } catch (e) {
                    alert("Error al borrar");
                }
            }
        };

        function renderizar() {
            lista.innerHTML = '';
            const fechaFiltro = filtroFechaEl.value;
            let ingresosTotales = 0;
            let egresosTotales = 0;
            let totalDia = 0;

            transacciones.forEach(t => {
                if (t.tipo === 'ingreso') ingresosTotales += t.monto;
                else egresosTotales += t.monto;

                if (t.fecha === fechaFiltro) {
                    totalDia += (t.tipo === 'ingreso' ? t.monto : -t.monto);
                }
                
                const fila = document.createElement('tr');
                fila.className = "hover:bg-slate-50 transition-colors";
                fila.innerHTML = `
                    <td class="px-6 py-4 text-xs font-medium text-slate-400">${t.fecha}</td>
                    <td class="px-6 py-4">
                        <div class="text-sm font-bold text-slate-800">${t.descripcion}</div>
                        <div class="text-[9px] uppercase font-bold text-indigo-400 mt-0.5">${getLabelCategoria(t.categoria)}</div>
                    </td>
                    <td class="px-6 py-4 text-right font-bold ${t.tipo === 'ingreso' ? 'text-emerald-600' : 'text-rose-500'}">
                        ${t.tipo === 'ingreso' ? '+' : '-'}${formatCurrency(t.monto)}
                    </td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="eliminarTransaccion('${t.id}')" class="text-slate-200 hover:text-rose-400 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </td>
                `;
                lista.appendChild(fila);
            });

            totalIngresosEl.textContent = formatCurrency(ingresosTotales);
            totalEgresosEl.textContent = formatCurrency(egresosTotales);
            resumenDiaEl.innerHTML = `Balance: <span class="${totalDia >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${formatCurrency(totalDia)}</span>`;
        }

        function formatCurrency(num) {
            return new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP' }).format(num);
        }

        function getLabelCategoria(cat) {
            const labels = {
                'ingreso-clase': 'Pago Alumno', 'ingreso-paciente': 'Atención Paciente',
                'ingreso-renta-consultorio': 'Renta Consultorio', 'ingreso-otro': 'Otro Ingreso',
                'egreso-profesor': 'Pago Profesor', 'egreso-insumos': 'Insumos',
                'egreso-renta': 'Renta Local', 'egreso-servicios': 'Servicios',
                'egreso-otro': 'Otro Egreso'
            };
            return labels[cat] || 'Registro';
        }

        window.exportarCSV = () => {
            if (transacciones.length === 0) return alert("No hay datos.");
            let csvContent = "\uFEFFFecha,Descripcion,Categoria,Tipo,Monto\n";
            transacciones.forEach(t => {
                csvContent += `${t.fecha},"${t.descripcion.replace(/"/g, '""')}",${t.categoria},${t.tipo},${t.monto}\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `reporte_finanzas.csv`;
            link.click();
        };

        filtroFechaEl.addEventListener('change', renderizar);
    </script>
</body>
</html>
